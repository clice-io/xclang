# clang-cl for @TRIPLE@, and a plain clang-cl of that architecture:
# Microsoft's CRT and STL and the Windows SDK, which `xclang sdk fetch
# windows --accept-license` fetches into ../sdk; the file it writes into
# ../sdk/windows, the SDK in use, names them. Without it clang-cl stops
# here, unable to open that file.
@../sdk/windows/@TRIPLE@-clang-cl.cfg
-fuse-ld=lld
# compiler-rt's builtins (__udivti3, ...), which clang-cl does not link by
# itself: named in every object, as the CRT is, so lld-link finds them in
# lib/clang/<ver>/lib/windows also when it links on its own (CMake).
-Xclang --dependent-lib=clang_rt.builtins-@ARCH@.lib
# The hybrid CRT: the VC runtime and the STL linked statically (/MT, the
# default), UCRT from Windows (ucrtbase.dll, part of Windows 10 and later)
# instead of the static libucrt.lib. /MD takes ucrt.lib anyway; /MTd and
# /MDd need /link /nodefaultlib:ucrt.lib.
-Xclang --linker-option=/nodefaultlib:libucrt.lib
-Xclang --dependent-lib=ucrt.lib

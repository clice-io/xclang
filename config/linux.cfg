# Linux target: glibc from the sysroot next to this file, xclang's own
# runtimes, linked statically. libc++'s headers are those all targets
# share, after the target's own __config_site.
--sysroot=<CFGDIR>/../@TRIPLE@
-stdlib++-isystem <CFGDIR>/../libc++/include/@NORMALIZED@/c++/v1
-stdlib++-isystem <CFGDIR>/../libc++/include/c++/v1
-rtlib=compiler-rt
-unwindlib=libunwind
-stdlib=libc++
-static-libstdc++
-static-libgcc
-fuse-ld=lld

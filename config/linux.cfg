# Linux target: glibc from the sysroot next to this file, xclang's own
# runtimes, linked statically.
--sysroot=<CFGDIR>/../@TRIPLE@
-rtlib=compiler-rt
-unwindlib=libunwind
-stdlib=libc++
-static-libstdc++
-static-libgcc
-fuse-ld=lld
# libpthread ahead of libc, where it is needed at all: glibc 2.17's static
# libpthread.a is one object that redefines some of libc.a's, so with
# -static it has to come first (libunwind asks for it, too late, through
# its dependent-library note).
$-Wl,--push-state,--as-needed,-lpthread,--pop-state

# Windows target: mingw-w64 from the sysroot next to this file, xclang's own
# runtimes (static libraries only). libc++'s headers are those all targets
# share, after the target's own __config_site; mingw-w64's are those both
# Windows targets share, searched where the sysroot's include would be:
# after clang's own headers, which include_next them.
--sysroot=<CFGDIR>/../@TRIPLE@
-stdlib++-isystem <CFGDIR>/../libc++/include/@NORMALIZED@/c++/v1
-stdlib++-isystem <CFGDIR>/../libc++/include/c++/v1
-idirafter <CFGDIR>/../mingw-w64/include
-rtlib=compiler-rt
-unwindlib=libunwind
-stdlib=libc++
-fuse-ld=lld

# macOS target: the SDK comes from Xcode (or -isysroot / SDKROOT); libc++
# and libc++abi are xclang's own, linked statically instead of the
# system's libc++.dylib.
-nostdinc++
-isystem <CFGDIR>/../@TRIPLE@/include/c++/v1
-nostdlib++
-mmacos-version-min=@MACOS_MIN@
-fuse-ld=lld
$<CFGDIR>/../@TRIPLE@/lib/libc++.a

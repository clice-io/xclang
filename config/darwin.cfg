# libc++ and libc++abi are xclang's own, linked statically instead of the
# system's libc++.dylib: its headers, those all targets share after the
# target's own __config_site, are the C++ library's include path (searched
# after -isystem, as on Linux), -lc++ finds libc++.a in the -L directory
# before the SDK's libc++.tbd, and -B lets clang find its module manifest
# (import std). The linker is ld64.lld, on macOS too (patches/0007);
# -fuse-ld=ld selects Apple's, for objects without LTO: it reads bitcode
# with Xcode's libLTO, which does not read this LLVM's, and xclang carries
# none, as it carries no LTO plugin for other system linkers.
-stdlib++-isystem <CFGDIR>/../libc++/include/@NORMALIZED@/c++/v1
-stdlib++-isystem <CFGDIR>/../libc++/include/c++/v1
-L<CFGDIR>/../@TRIPLE@/lib
-B<CFGDIR>/../@TRIPLE@/lib
-mmacos-version-min=@MACOS_MIN@
-fuse-ld=lld

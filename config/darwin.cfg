# macOS target: the SDK comes from Xcode (or -isysroot / SDKROOT); libc++
# and libc++abi are xclang's own, linked statically instead of the
# system's libc++.dylib: -lc++ finds libc++.a in the -L directory before
# the SDK's libc++.tbd, and -B lets clang find its module manifest
# (import std).
-nostdinc++
-isystem <CFGDIR>/../@TRIPLE@/include/c++/v1
-L<CFGDIR>/../@TRIPLE@/lib
-B<CFGDIR>/../@TRIPLE@/lib
-mmacos-version-min=@MACOS_MIN@
-fuse-ld=lld

name: stage-runtimes

# The runtimes of every target, built once with the bootstrap compiler:
# one artifact runtimes-<triple> per Linux (glibc, musl) and MinGW target, one
# runtimes-darwin for both macOS targets, one runtimes-msvc for both MSVC
# targets (their libc++ and compiler-rt). Units not in `build` are copied from the run
# `reuse-run`, so every run carries the full set.

on:
  workflow_call:
    inputs:
      build:
        description: JSON list of the units to build
        type: string
        required: true
      reuse-run:
        description: Run to copy the other units from
        type: string
        default: ""

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - name: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
          - name: x86_64-w64-mingw32
            os: ubuntu-24.04
          - name: aarch64-w64-mingw32
            os: ubuntu-24.04
          - name: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - name: aarch64-unknown-linux-musl
            os: ubuntu-24.04
          - name: darwin
            os: macos-15
          - name: msvc
            os: ubuntu-24.04
    runs-on: ${{ contains(fromJSON(inputs.build), matrix.name) && matrix.os || 'ubuntu-24.04' }}
    timeout-minutes: 120
    env:
      BUILD: ${{ contains(fromJSON(inputs.build), matrix.name) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        if: env.BUILD != 'true'
        with:
          node-version: 24
      - uses: ./.github/actions/setup
        if: env.BUILD == 'true'
      # The MSVC targets' libc++ and compiler-rt are built against Microsoft's CRT and
      # Windows SDK, which xclang's own command fetches (windows-2022's,
      # MSVC 14.44: libraries built with it link with it and with newer
      # ones). Nothing of it leaves the job, only the libraries built.
      - name: Windows SDK
        if: env.BUILD == 'true' && matrix.name == 'msvc'
        run: |
          (cd xclang && cargo build --release --locked)
          xclang/target/release/xclang sdk fetch windows --accept-license --preset windows-2022 --sdk-dir work/sdk
      - name: Runtimes
        if: env.BUILD == 'true'
        run: |
          pixi run runtimes --target ${{ matrix.name }}
          tar -C work/out -cf - runtimes-${{ matrix.name }} | zstd -T0 -3 -o runtimes-${{ matrix.name }}.tar.zst
      - name: Reuse
        if: env.BUILD != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ -n "${{ inputs.reuse-run }}" ]] || { echo "::error::${{ matrix.name }} is neither built nor reused"; exit 1; }
          node tests/lib/retry.ts bash -c 'rm -f "runtimes-$1.tar.zst"; gh run download "$0" -R "$GITHUB_REPOSITORY" -n "runtimes-$1"' \
            "${{ inputs.reuse-run }}" "${{ matrix.name }}"
      - uses: actions/upload-artifact@v7
        with:
          name: runtimes-${{ matrix.name }}
          path: runtimes-${{ matrix.name }}.tar.zst
          compression-level: 0
          # What a repack reuses: 90 days, GitHub's longest.
          retention-days: 90
          if-no-files-found: error

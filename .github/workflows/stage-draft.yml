name: stage-draft

# A draft release <llvm version>.<revision> with every archive and the
# profile. A release is built from a commit of main, on the branch
# release/<version> made there, so that a run again with reuse-run stays on
# it. The draft is made at a commit of its own: that one with the Bazel
# module at the release (packages/bazel/bazel.ts versions), pushed to the
# branch, so that the tag names the release whose archives a git_override
# of it downloads. The commit has the run's commit's times: a rebuild of
# the tag makes the same archives. main is not touched: the release's pull
# request merges the branch into main, and that push publishes the draft
# (published.yml), so that every tag is in main's history and `latest`
# moves forward from one to the next.

on:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true
      dist-run:
        type: string
        required: true
      profile-run:
        type: string
        required: true

jobs:
  draft:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
          run-id: ${{ inputs.dist-run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: profile
          path: profile
          run-id: ${{ inputs.profile-run }}
          github-token: ${{ github.token }}
      - name: Draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          llvm=$(sed -n 's/^export const LLVM_VERSION = "\(.*\)";/\1/p' toolchain/common.ts)
          version="$llvm.${{ inputs.revision }}"
          if gh release view "$version" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::release $version exists; a rebuild gets the next revision"
            exit 1
          fi
          # Built from main: the run's commit is in its history, and so is
          # `latest`, the tag of the release before, which published.yml
          # moves forward to this one's.
          head=$(git rev-parse HEAD)
          if [[ "$GITHUB_REF" != "refs/heads/release/$version" ]]; then
            echo "::error::a release is drafted from its branch release/$version, made at a commit of main, not $GITHUB_REF"
            exit 1
          fi
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$head" -q .status)
          if [[ "$status" != behind && "$status" != identical ]]; then
            echo "::error::the run's commit $head is not in main's history ($status): release/$version is made at a commit of main"
            exit 1
          fi
          if git fetch -q --depth=1 origin refs/heads/latest; then
            latest=$(git rev-parse FETCH_HEAD)
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$latest...$head" -q .status)
            if [[ "$status" != ahead && "$status" != identical ]]; then
              echo "::error::latest ($latest), the tag of the release before, is not in the history of the run's commit ($status): a pull request merging that tag into main (a merge commit), then release/$version made again at main, and the run again"
              exit 1
            fi
          fi
          # The archives of this version only: never another run's under
          # this one's name.
          for f in dist/*; do
            if [[ "$f" != *"-$version-"* && "$f" != *"-$version.tar.xz" ]]; then
              echo "::error::$f is not an archive of $version"
              exit 1
            fi
          done
          cp profile/profile.profdata "dist/xclang-$version.profdata"
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS | tee -a "$GITHUB_STEP_SUMMARY"
          node packages/bazel/bazel.ts versions dist/SHA256SUMS
          if ! git diff --quiet; then
            git add packages/bazel
            export GIT_AUTHOR_DATE="$(git log -1 --format=%aI)" GIT_COMMITTER_DATE="$(git log -1 --format=%cI)"
            export GIT_AUTHOR_NAME="github-actions[bot]" GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
            export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
            commit=$(git commit-tree "$(git write-tree)" -p HEAD \
              -m "bazel: the module of $version" \
              -m "packages/bazel/bazel/versions.bzl and MODULE.bazel name $version, from its SHA256SUMS (stage-draft.yml).")
            git reset -q "$commit"
            # Not forced: a branch that moved since the run began stops the
            # draft.
            git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY" "HEAD:$GITHUB_REF"
          fi
          echo "the draft's commit: $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          gh release create "$version" -R "$GITHUB_REPOSITORY" --draft --target "$(git rev-parse HEAD)" \
            --title "$version" \
            --notes "LLVM $llvm, build run https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            dist/*

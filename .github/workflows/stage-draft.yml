name: stage-draft

# A draft release <llvm version>.<revision> with every archive and the
# profile. Drafts create no tag; publishing one is done by hand, and tags
# the draft's commit: the run's, with the Bazel module at the release
# (packages/bazel/bazel.ts versions), pushed to the run's branch, so that
# the tag, and main after the branch's pull request, name the release whose
# archives a git_override of them downloads. The commit has the run's
# commit's times: a rebuild of the tag makes the same archives. It also
# merges the `latest` branch, the tag of the release before, keeping its
# own tree: main takes a release's branch squashed, so the tag would not
# descend from the one before, and published.yml moves `latest` forward
# only, as FetchContent's update of a `latest` checkout rebases onto it.

on:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true
      dist-run:
        type: string
        required: true
      profile-run:
        type: string
        required: true

jobs:
  draft:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
          run-id: ${{ inputs.dist-run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: profile
          path: profile
          run-id: ${{ inputs.profile-run }}
          github-token: ${{ github.token }}
      - name: Draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          llvm=$(sed -n 's/^export const LLVM_VERSION = "\(.*\)";/\1/p' toolchain/common.ts)
          version="$llvm.${{ inputs.revision }}"
          if gh release view "$version" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::release $version exists; a rebuild gets the next revision"
            exit 1
          fi
          # The archives of this version only: never another run's under
          # this one's name.
          for f in dist/*; do
            if [[ "$f" != *"-$version-"* && "$f" != *"-$version.tar.xz" ]]; then
              echo "::error::$f is not an archive of $version"
              exit 1
            fi
          done
          cp profile/profile.profdata "dist/xclang-$version.profdata"
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ "$GITHUB_REF" != refs/heads/* ]]; then
            echo "::error::a release is drafted from a branch, not $GITHUB_REF"
            exit 1
          fi
          node packages/bazel/bazel.ts versions dist/SHA256SUMS
          if ! git diff --quiet; then
            git add packages/bazel
            # `latest`, unless the run's commit has it already.
            latest=""
            if git fetch -q --depth=1 origin refs/heads/latest; then
              latest=$(git rev-parse FETCH_HEAD)
              status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$latest...$(git rev-parse HEAD)" -q .status)
              if [[ "$status" == ahead || "$status" == identical ]]; then latest=""; fi
            fi
            export GIT_AUTHOR_DATE="$(git log -1 --format=%aI)" GIT_COMMITTER_DATE="$(git log -1 --format=%cI)"
            export GIT_AUTHOR_NAME="github-actions[bot]" GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
            export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
            commit=$(git commit-tree "$(git write-tree)" -p HEAD ${latest:+-p "$latest"} \
              -m "bazel: the module of $version" \
              -m "packages/bazel/bazel/versions.bzl and MODULE.bazel name $version, from its SHA256SUMS (stage-draft.yml).${latest:+ Merges latest ($latest), the tag of the release before, keeping the tree of this commit, so that latest moves forward to this one.}")
            git reset -q "$commit"
            # Not forced: a branch that moved since the run began stops the draft.
            git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY" "HEAD:$GITHUB_REF"
          fi
          echo "the draft's commit: $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          gh release create "$version" -R "$GITHUB_REPOSITORY" --draft --target "$(git rev-parse HEAD)" \
            --title "$version" \
            --notes "LLVM $llvm, build run https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            dist/*

name: stage-draft

# A draft release <llvm version>.<revision> with every archive and the
# profile. A release is built from a commit of main, on the branch
# release/<version> made there, so that a run again with reuse-run stays on
# it. The draft is made at a commit of its own: that one with the Bazel
# module at the release (packages/bazel/bazel.ts versions), pushed to the
# branch, so that the tag names the release whose archives a git_override
# of it downloads. The commit has the run's commit's times: a rebuild of
# the tag makes the same archives. Its message names the runs of the
# release (Archives-Run, Compiler-Run, Profile-Run): checks of the commit
# before the release is published test the archives of Archives-Run
# (test-bazel.yml), and a repack takes the compiler, runtimes and profile
# of the others (tests/release/preflight.ts finds them). main is not
# touched: the release's pull request merges the branch into main, and that
# push publishes the draft (published.yml), so that every tag is in main's
# history and `latest` moves forward from one to the next.
#
# Run again, it finishes what it began: on the branch's module commit of
# the same archives (a run started after the commit was pushed), or with
# the draft of its commit (assets uploaded again). A draft of another commit,
# or a published release, stops it.

on:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true
      dist-run:
        type: string
        required: true
      profile-run:
        type: string
        required: true
      toolchain-run:
        description: Run whose toolchain-* and runtimes-* artifacts the archives were packaged from
        type: string
        required: true

jobs:
  draft:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # With its parent: the run's commit may be the module commit of a
      # run before.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
          run-id: ${{ inputs.dist-run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: profile
          path: profile
          run-id: ${{ inputs.profile-run }}
          github-token: ${{ github.token }}
      - name: Draft
        env:
          GH_TOKEN: ${{ github.token }}
          DIST_RUN: ${{ inputs.dist-run }}
          PROFILE_RUN: ${{ inputs.profile-run }}
          TOOLCHAIN_RUN: ${{ inputs.toolchain-run }}
        run: |
          retry() { node tests/lib/retry.ts "$@"; }
          llvm=$(sed -n 's/^export const LLVM_VERSION = "\(.*\)";/\1/p' toolchain/common.ts)
          version="$llvm.${{ inputs.revision }}"
          branch="release/$version"
          if [[ "$GITHUB_REF" != "refs/heads/$branch" ]]; then
            echo "::error::a release is drafted from its branch $branch, made at a commit of main, not $GITHUB_REF"
            exit 1
          fi
          # The release as it is: none, a draft (of a run before) or
          # published.
          existing=$(retry gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            -q ".[] | select(.tag_name == \"$version\") | [(.draft | tostring), .target_commitish] | @tsv")
          if [[ "$existing" == false* ]]; then
            echo "::error::release $version is published; a rebuild gets the next revision"
            exit 1
          fi
          # Built from main: the run's commit is in its history, or is the
          # module commit of an earlier run of this release, whose parent is.
          head=$(git rev-parse HEAD)
          base=$head
          if [[ "$(git log -1 --format=%s HEAD)" == "bazel: the module of $version" ]]; then
            base=$(git rev-parse HEAD^)
            echo "the run's commit is the module commit of $version, on $base" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          status=$(retry gh api "repos/$GITHUB_REPOSITORY/compare/main...$base" -q .status)
          if [[ "$status" != behind && "$status" != identical ]]; then
            echo "::error::the run's commit $base is not in main's history ($status): $branch is made at a commit of main (docs/en/dev/releasing.md, Troubleshooting)"
            exit 1
          fi
          # `latest`, the tag of the release before, which published.yml
          # moves forward to this one's.
          if git fetch -q --depth=1 origin refs/heads/latest; then
            latest=$(git rev-parse FETCH_HEAD)
            status=$(retry gh api "repos/$GITHUB_REPOSITORY/compare/$latest...$base" -q .status)
            if [[ "$status" != ahead && "$status" != identical ]]; then
              echo "::error::latest ($latest), the tag of the release before, is not in the history of the run's commit ($status): a pull request merging that tag into main (a merge commit), then $branch made again at main, and the run again"
              exit 1
            fi
          fi
          # The archives of this version only: never another run's under
          # this one's name.
          for f in dist/*; do
            if [[ "$f" != *"-$version-"* && "$f" != *"-$version.tar.xz" ]]; then
              echo "::error::$f is not an archive of $version"
              exit 1
            fi
          done
          cp profile/profile.profdata "dist/xclang-$version.profdata"
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS | tee -a "$GITHUB_STEP_SUMMARY"
          git checkout -q "$base" -- packages/bazel
          node packages/bazel/bazel.ts versions dist/SHA256SUMS
          if [[ "$head" != "$base" ]]; then
            # The module commit of the run before: these archives' module,
            # or another's, which this run cannot draft on.
            if ! git diff --quiet HEAD; then
              echo "::error::$branch has the module commit of other archives ($head): reset the branch to its parent, git push -f origin $base:refs/heads/$branch, and run again"
              exit 1
            fi
          elif ! git diff --quiet; then
            git add packages/bazel
            export GIT_AUTHOR_DATE="$(git log -1 --format=%aI)" GIT_COMMITTER_DATE="$(git log -1 --format=%cI)"
            export GIT_AUTHOR_NAME="github-actions[bot]" GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
            export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
            commit=$(git commit-tree "$(git write-tree)" -p HEAD \
              -m "bazel: the module of $version" \
              -m "packages/bazel/bazel/versions.bzl and MODULE.bazel name $version, from its SHA256SUMS (stage-draft.yml)." \
              -m "Archives-Run: $DIST_RUN
          Compiler-Run: $TOOLCHAIN_RUN
          Profile-Run: $PROFILE_RUN")
            git reset -q "$commit"
            # Not forced: a branch that moved since the run began stops the
            # draft. The same commit again (a run again of this one) is
            # there already.
            retry git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY" "HEAD:$GITHUB_REF"
          fi
          target=$(git rev-parse HEAD)
          echo "the draft's commit: $target" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ -n "$existing" && "${existing#*$'\t'}" != "$target" ]]; then
            echo "::error::a draft of $version exists at ${existing#*$'\t'}, not $target: delete it (gh release delete $version -R $GITHUB_REPOSITORY --yes), reset $branch to the commit of main it was made at, and run again"
            exit 1
          fi
          if [[ -z "$existing" ]]; then
            retry gh release create "$version" -R "$GITHUB_REPOSITORY" --draft --target "$target" --title "$version" \
              --notes "LLVM $llvm, build run https://github.com/$GITHUB_REPOSITORY/actions/runs/$DIST_RUN"
          fi
          # One asset at a time, each tried again on its own; --clobber
          # replaces one that a failed upload left behind.
          for f in dist/*; do
            retry gh release upload "$version" -R "$GITHUB_REPOSITORY" --clobber "$f"
          done
          # The draft has every file, of the bytes SHA256SUMS lists.
          retry gh release view "$version" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[] | [.name, .size] | @tsv' | sort > assets.txt
          (cd dist && for f in *; do printf '%s\t%s\n' "$f" "$(stat -c %s "$f")"; done) | sort > files.txt
          diff files.txt assets.txt

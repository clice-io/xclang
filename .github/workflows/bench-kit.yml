name: bench-kit

# Temporary: the compilers tests/bench.ts compares, cut down to what
# compiling for the native target needs, so that they download quickly to
# the local machine the benchmark runs on.

on:
  workflow_dispatch:
    inputs:
      pgo-run:
        type: string
        required: true
      nopgo-run:
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  kit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Kits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          slim() {  # <xclang tree> <dest> <target dir> <exe suffix>
            mkdir -p "$2/bin" "$2/lib/clang"
            cp -a "$1"/bin/clang$4 "$1"/bin/clang++$4 "$1"/bin/*.cfg "$2/bin/"
            cp -a "$1"/lib/clang/23 "$2/lib/clang/"
            cp -a "$1/$3" "$2/"
          }
          for kind in pgo:${{ inputs.pgo-run }} nopgo:${{ inputs.nopgo-run }}; do
            k=${kind%%:*}; r=${kind#*:}
            gh run download "$r" -R "$GITHUB_REPOSITORY" -n dist-x86_64-unknown-linux-gnu -D "dl/$k-linux"
            gh run download "$r" -R "$GITHUB_REPOSITORY" -n dist-x86_64-w64-mingw32 -D "dl/$k-windows"
            mkdir -p "x/$k-linux" "x/$k-windows"
            tar -C "x/$k-linux" -xf dl/$k-linux/xclang-*.tar.xz
            (cd "x/$k-windows" && unzip -q ../../dl/$k-windows/xclang-*.zip)
            slim "x/$k-linux/xclang" "kit-linux/$k" x86_64-unknown-linux-gnu ""
            slim "x/$k-windows/xclang" "kit-windows/$k" x86_64-w64-mingw32 .exe
          done
          linux=$(node scripts/fetch.ts bootstrap-linux)
          mkdir -p kit-linux/official
          zstd -dc --long=31 "$linux" | tar -C kit-linux/official -xf - --strip-components=1 --wildcards \
            '*/bin/clang' '*/bin/clang++' '*/bin/clang-23' '*/lib/clang/23/include/*'
          windows=$(node scripts/fetch.ts llvm-windows-x64)
          mkdir -p kit-windows/official
          xz -dc "$windows" | tar -C kit-windows/official -xf - --strip-components=1 --wildcards \
            '*/bin/clang.exe' '*/bin/clang++.exe' '*/lib/clang/23/include/*'
          du -sh kit-*/*
          tar -cf - kit-linux | zstd -T0 -10 -o kit-linux.tar.zst
          tar -cf - kit-windows | zstd -T0 -10 -o kit-windows.tar.zst
          ls -la kit-*.tar.zst
      - uses: actions/upload-artifact@v7
        with:
          name: bench-kits
          path: kit-*.tar.zst
          compression-level: 0
          retention-days: 7

name: release
run-name: "release: revision ${{ inputs.revision }}, ${{ inputs.stages }}${{ inputs.repack-of && format(', against {0}', inputs.repack-of) || '' }}"

# The release pipeline: a full build of a release, or a repack, up to a
# draft. By hand on purpose: a full build takes three hours and about a
# thousand runner-minutes, and a release is the maintainers' decision.
# Each stage is a reusable workflow; `stages` picks which run, and the *-run
# inputs take a stage's artifacts from an earlier run instead of building
# them again.
#
#   runtimes       runtimes of every target (stage-runtimes.yml)
#   instrumented   the clang and lld that record the profile, Linux x64
#                  (stage-toolchain.yml)
#   train          the training run, giving `profile` (stage-train.yml)
#   toolchain      every host's toolchain and libclang (stage-toolchain.yml)
#   asan           the ASan libclang of Linux x64 and macOS arm64
#   package        every host's release archives (stage-package.yml)
#   test           every host's archives checked on a machine of that host,
#                  and the programs they build for other targets on a
#                  machine of those (test-archives.yml)
#   bazel          the Bazel module with every host's archives
#                  (test-bazel.yml)
#   cmake          the CMake package with every host's archives
#                  (test-cmake.yml)
#   sdk            the MSVC targets, and the macOS ones from Linux and
#                  Windows hosts, with the SDKs the archives' own command
#                  fetches (test-sdk.yml; needs cli)
#   cli            the archives' own command (cli.yml)
#   rebuild        once train is done, the second full build: this
#                  workflow run again on the same commit, every stage but
#                  the training (its profile this run's) and the tests of
#                  the archives, which compare every file with this run's
#                  (repack-of=<this run>); started once, also when this run
#                  runs again
#   release        a draft release of everything (stage-draft.yml; needs
#                  the profile), only on release/<version>, a branch made
#                  at the commit of main the release is built from
#
# A repack is a release whose compiler and runtimes are an earlier
# release's: reuse-run and profile-run name that release's run, and the
# stages are package, the tests and release. With repack-of, the test
# stage also checks every host's archives against that release's: only
# what the packaging writes differs (tests/release/repack.ts). repack-of
# can also be a run id, of a run of the same revision: a rebuild must then
# give that run's archives again, every file (with its profile, as training
# does not give the same profile twice).
#
# With cli (the default), the package stage builds xclang's own command
# (cli.yml) and puts it into every toolchain archive.

on:
  workflow_dispatch:
    inputs:
      stages:
        description: "Comma-separated stages: runtimes, instrumented, train, toolchain, asan, package, test, bazel, cmake, sdk, cli, rebuild, release"
        type: string
        default: runtimes,instrumented,train,toolchain,asan,package,test,bazel,cmake,sdk,cli
      runtimes:
        description: JSON list of the runtimes units to build; the others come from reuse-run
        type: string
        default: '["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-w64-mingw32", "aarch64-w64-mingw32", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl", "darwin", "msvc"]'
      hosts:
        description: JSON list of the hosts to build a toolchain for
        type: string
        default: '["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-w64-mingw32", "aarch64-w64-mingw32", "aarch64-apple-darwin", "x86_64-apple-darwin"]'
      reuse-run:
        description: Run whose artifacts stand in for the stages not run
        type: string
        default: ""
      runtimes-run:
        description: Run to copy the runtimes from instead of reuse-run
        type: string
        default: ""
      profile-run:
        description: Run holding the profile when train does not run; none builds without PGO
        type: string
        default: none
      revision:
        description: Release revision, the last component of <llvm version>.<revision>
        type: string
        default: "1"
      repack-of:
        description: Release whose compiler and runtimes this run reuses, or a run of the same revision this one rebuilds; its archives must equal this run's but for the packaging (a run's, every file)
        type: string
        default: ""
      cli:
        description: Put xclang's own command (xclang/) into the toolchain archives
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  # Always runs: without the runtimes stage it copies every unit from
  # reuse-run, so the later stages find the runtimes in this run.
  runtimes:
    uses: ./.github/workflows/stage-runtimes.yml
    with:
      build: ${{ contains(inputs.stages, 'runtimes') && inputs.runtimes || '[]' }}
      reuse-run: ${{ inputs.runtimes-run || inputs.reuse-run }}

  instrumented:
    needs: runtimes
    if: ${{ !cancelled() && contains(inputs.stages, 'instrumented') && needs.runtimes.result == 'success' }}
    uses: ./.github/workflows/stage-toolchain.yml
    with:
      host: x86_64-unknown-linux-gnu
      mode: instrumented
      runtimes-run: ${{ github.run_id }}

  train:
    needs: [runtimes, instrumented]
    if: ${{ !cancelled() && contains(inputs.stages, 'train') && !contains(needs.*.result, 'failure') }}
    uses: ./.github/workflows/stage-train.yml
    with:
      runtimes-run: ${{ github.run_id }}
      instrumented-run: ${{ needs.instrumented.result == 'success' && github.run_id || inputs.reuse-run }}

  # A stage of `stages` that did not succeed (skipped when one before it
  # failed) stops the stages after it, which would otherwise take the
  # artifacts of reuse-run, or none, in its place.
  toolchain:
    needs: [runtimes, train]
    if: ${{ !cancelled() && contains(inputs.stages, 'toolchain') && !contains(needs.*.result, 'failure') && (needs.train.result == 'success' || !contains(inputs.stages, 'train')) }}
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(inputs.hosts) }}
    uses: ./.github/workflows/stage-toolchain.yml
    with:
      host: ${{ matrix.host }}
      runtimes-run: ${{ github.run_id }}
      profile-run: ${{ needs.train.result == 'success' && github.run_id || inputs.profile-run }}

  asan:
    needs: runtimes
    if: ${{ !cancelled() && contains(inputs.stages, 'asan') && needs.runtimes.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        host: [x86_64-unknown-linux-gnu, aarch64-apple-darwin]
    uses: ./.github/workflows/stage-toolchain.yml
    with:
      host: ${{ matrix.host }}
      mode: asan
      runtimes-run: ${{ github.run_id }}

  cli:
    if: ${{ inputs.cli && contains(inputs.stages, 'package') }}
    uses: ./.github/workflows/cli.yml
    with:
      revision: ${{ inputs.revision }}
      build-only: true

  package:
    needs: [runtimes, toolchain, asan, cli]
    if: ${{ !cancelled() && contains(inputs.stages, 'package') && !contains(needs.*.result, 'failure') && (needs.toolchain.result == 'success' || !contains(inputs.stages, 'toolchain')) && (needs.asan.result == 'success' || !contains(inputs.stages, 'asan')) }}
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(inputs.hosts) }}
    uses: ./.github/workflows/stage-package.yml
    with:
      host: ${{ matrix.host }}
      revision: ${{ inputs.revision }}
      runtimes-run: ${{ github.run_id }}
      toolchain-run: ${{ needs.toolchain.result == 'success' && github.run_id || inputs.reuse-run }}
      cli-run: ${{ needs.cli.result == 'success' && github.run_id || '' }}

  test:
    needs: package
    if: ${{ !cancelled() && contains(inputs.stages, 'test') && (needs.package.result == 'success' || !contains(inputs.stages, 'package')) }}
    uses: ./.github/workflows/test-archives.yml
    with:
      hosts: ${{ inputs.hosts }}
      dist-run: ${{ needs.package.result == 'success' && github.run_id || inputs.reuse-run }}
      repack-of: ${{ inputs.repack-of }}

  bazel:
    needs: package
    if: ${{ !cancelled() && contains(inputs.stages, 'bazel') && (needs.package.result == 'success' || !contains(inputs.stages, 'package')) }}
    uses: ./.github/workflows/test-bazel.yml
    with:
      dist-run: ${{ needs.package.result == 'success' && github.run_id || inputs.reuse-run }}

  cmake:
    needs: package
    if: ${{ !cancelled() && contains(inputs.stages, 'cmake') && (needs.package.result == 'success' || !contains(inputs.stages, 'package')) }}
    uses: ./.github/workflows/test-cmake.yml
    with:
      dist-run: ${{ needs.package.result == 'success' && github.run_id || inputs.reuse-run }}

  sdk:
    needs: package
    if: ${{ !cancelled() && contains(inputs.stages, 'sdk') && (needs.package.result == 'success' || !contains(inputs.stages, 'package')) }}
    uses: ./.github/workflows/test-sdk.yml
    with:
      dist-run: ${{ needs.package.result == 'success' && github.run_id || inputs.reuse-run }}

  cli-test:
    needs: package
    if: ${{ !cancelled() && contains(inputs.stages, 'cli') && (needs.package.result == 'success' || !contains(inputs.stages, 'package')) }}
    uses: ./.github/workflows/cli.yml
    with:
      dist-run: ${{ needs.package.result == 'success' && github.run_id || inputs.reuse-run }}

  # Started from here so that no release forgets it; what differs is a bug
  # to list, not a failure of this run (docs/en/dev/releasing.md,
  # Reproducible Rebuilds). The first run of the same revision with
  # `against <this run>` in its name is it.
  rebuild:
    needs: train
    if: ${{ !cancelled() && contains(inputs.stages, 'rebuild') && needs.train.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: The second full build
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ inputs.revision }}
          HOSTS: ${{ inputs.hosts }}
          CLI: ${{ inputs.cli }}
        run: |
          retry() { node tests/lib/retry.ts "$@"; }
          title="release: revision $REVISION, runtimes,toolchain,asan,package,test, against $GITHUB_RUN_ID"
          found=$(retry gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?branch=$GITHUB_REF_NAME&per_page=50" \
            -q ".workflow_runs[] | select(.display_title == \"$title\") | .id" | head -n 1)
          if [[ -z "$found" ]]; then
            retry gh workflow run release.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
              -f stages=runtimes,toolchain,asan,package,test -f hosts="$HOSTS" -f cli="$CLI" \
              -f profile-run="$GITHUB_RUN_ID" -f repack-of="$GITHUB_RUN_ID" -f revision="$REVISION"
            for i in $(seq 20); do
              sleep 15
              found=$(retry gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?branch=$GITHUB_REF_NAME&event=workflow_dispatch&per_page=20" \
                -q ".workflow_runs[] | select(.display_title == \"$title\") | .id" | head -n 1)
              [[ -n "$found" ]] && break
            done
          fi
          [[ -n "$found" ]] || { echo "::error::the second full build did not start"; exit 1; }
          echo "the second full build: https://github.com/$GITHUB_REPOSITORY/actions/runs/$found" | tee -a "$GITHUB_STEP_SUMMARY"

  release:
    needs: [train, package, test, bazel, cmake, sdk, cli-test]
    if: ${{ !cancelled() && contains(inputs.stages, 'release') && !contains(needs.*.result, 'failure') && (needs.package.result == 'success' || !contains(inputs.stages, 'package')) && (needs.train.result == 'success' || !contains(inputs.stages, 'train')) }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/stage-draft.yml
    with:
      revision: ${{ inputs.revision }}
      dist-run: ${{ needs.package.result == 'success' && github.run_id || inputs.reuse-run }}
      profile-run: ${{ needs.train.result == 'success' && github.run_id || inputs.profile-run }}
      # The package stage's (of reuse-run when package did not run here).
      toolchain-run: ${{ contains(inputs.stages, 'toolchain') && needs.package.result == 'success' && github.run_id || inputs.reuse-run }}

name: release

# A draft release <llvm version>.<revision> with every archive, the
# profile, and the Bazel module with the archives' digests. Drafts create no
# tag; publishing one is done by hand.

on:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true
      dist-run:
        type: string
        required: true
      profile-run:
        type: string
        required: true

jobs:
  draft:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
          run-id: ${{ inputs.dist-run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: profile
          path: profile
          run-id: ${{ inputs.profile-run }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          llvm=$(sed -n 's/^export const LLVM_VERSION = "\(.*\)";/\1/p' scripts/common.ts)
          version="$llvm.${{ inputs.revision }}"
          if gh release view "$version" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::release $version exists; a rebuild gets the next revision"
            exit 1
          fi
          cp profile/profile.profdata "dist/xclang-$version.profdata"
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS | tee -a "$GITHUB_STEP_SUMMARY"
          # The Bazel module at this release, holding the digests above: the
          # source a consumer's archive_override names (README.md, "Bazel").
          node scripts/bazel.ts archive dist/SHA256SUMS dist | tee bazel.txt
          integrity=$(sed -n 's/^integrity //p' bazel.txt)
          if [ ! -f "dist/xclang-bazel-$version.tar.gz" ] || [ -z "$integrity" ]; then
            echo "::error::no Bazel module for $version"
            exit 1
          fi
          echo "xclang-bazel-$version.tar.gz $integrity" | tee -a "$GITHUB_STEP_SUMMARY"
          gh release create "$version" -R "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "xclang $version" \
            --notes "LLVM $llvm, build run https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Bazel module: xclang-bazel-$version.tar.gz, integrity $integrity" \
            dist/*

name: diag

# Temporary: where ld64.lld's ThinLTO loses exception handling (LLVM's own
# 23.1.2, macOS arm64).

on:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Diagnose
        run: |
          set +e
          export SDKROOT=$(xcrun --show-sdk-path)
          B=$PWD/work/bootstrap/bin
          mkdir d && cd d
          cat > t.cpp <<'SRC'
          #include <cstdio>
          #include <stdexcept>
          int main() {
            try { throw std::runtime_error("caught"); }
            catch (const std::exception& e) { std::puts(e.what()); return 0; }
            return 1;
          }
          SRC
          for lto in thin full; do
            mkdir $lto && (cd $lto && "$B/clang++" -O2 -flto=$lto -fuse-ld=lld -Wl,-save-temps ../t.cpp -o a.out; ./a.out; echo "$lto exit $?"; ls)
          done
          echo "=== unwind info"
          for lto in thin full; do echo "--- $lto"; "$B/llvm-objdump" --macho --unwind-info $lto/a.out | head -n 40; done
          echo "=== the LTO objects"
          for o in thin/a.out.lto.o thin/a.out1.lto.o; do echo "--- $o"; "$B/llvm-objdump" -h -t "$o"; done
          echo "=== both LTO objects relinked without LTO"
          "$B/clang++" -fuse-ld=lld thin/a.out.lto.o thin/a.out1.lto.o -o order1; ./order1; echo "empty first exit $?"
          "$B/llvm-objdump" --macho --unwind-info order1 | grep -E 'function offset' | head
          "$B/clang++" -fuse-ld=lld thin/a.out1.lto.o thin/a.out.lto.o -o order2; ./order2; echo "empty last exit $?"
          "$B/clang++" -fuse-ld=lld thin/a.out1.lto.o -o alone; ./alone; echo "without the empty object exit $?"
          echo "=== workarounds"
          "$B/clang++" -O2 -flto=thin -fuse-ld=lld -Wl,--thinlto-jobs=1 t.cpp -o jobs1; ./jobs1; echo "jobs1 exit $?"
          "$B/clang++" -O2 -flto=thin -fuse-ld=lld -Wl,-no_compact_unwind t.cpp -o nocu; ./nocu; echo "no_compact_unwind exit $?"
          "$B/clang++" -O2 -flto=thin -fuse-ld=lld -Wl,-dead_strip t.cpp -o dead; ./dead; echo "dead_strip exit $?"

name: diag

# Temporary: why a ThinLTO program built by the macOS toolchain does not
# catch its exception.

on:
  workflow_dispatch:
    inputs:
      dist-run:
        type: string
        required: true

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-aarch64-apple-darwin
          path: dist
          run-id: ${{ inputs.dist-run }}
          github-token: ${{ github.token }}
      - name: Variants
        run: |
          mkdir x && tar -C x -xf dist/xclang-*.tar.xz
          X=$PWD/x/xclang
          cat > t.cpp <<'SRC'
          #include <cstdio>
          #include <stdexcept>
          #include <string>
          int main() {
            try { throw std::runtime_error(std::string("caught")); }
            catch (const std::exception& e) { std::puts(e.what()); return 0; }
            return 1;
          }
          SRC
          lib=$X/aarch64-apple-darwin/lib
          inc=$X/aarch64-apple-darwin/include/c++/v1
          try() { name=$1; shift; echo "=== $name: $*"; set +e; "$X/bin/clang++" "$@" t.cpp -o "$name" && ./"$name"; echo "exit $?"; set -e; }
          try cfg-O2 -O2
          try cfg-thin -O2 -flto=thin
          try cfg-full -O2 -flto=full
          try cfg-thin-O0 -O0 -flto=thin
          manual=(--no-default-config -nostdinc++ -isystem "$inc" -fuse-ld=lld)
          try man-O2-L -O2 "${manual[@]}" -L"$lib"
          try man-thin-L -O2 -flto=thin "${manual[@]}" -L"$lib"
          try man-thin-archive -O2 -flto=thin "${manual[@]}" -nostdlib++ "$lib/libc++.a"
          try man-thin-syslibcxx -O2 -flto=thin --no-default-config -fuse-ld=lld
          try man-thin-nounwind -O2 -flto=thin "${manual[@]}" -L"$lib" -Wl,-no_compact_unwind
          "$X/bin/llvm-nm" -m "$lib/libc++.a" 2>/dev/null | grep -E '__gxx_personality_v0|_ZTISt9exception$|_ZTISt13runtime_error' | head
          "$X/bin/llvm-nm" -m cfg-thin | grep -E 'personality|_ZTISt9exception|_ZTISt13runtime_error' | head
          "$X/bin/llvm-otool" -L cfg-thin

name: build

on:
  workflow_dispatch:

jobs:
  sysroot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/rattler-build-action@v0.2.39
        with:
          recipe-path: recipes/xclang-bootstrap/recipe.yaml
          build-args: --channel conda-forge
          upload-artifact: false
      # The action only uploads the .conda files; a local channel also needs
      # the repodata.json rattler-build writes next to them.
      - uses: actions/upload-artifact@v4
        with:
          name: xclang-sysroot
          path: output/noarch/
          if-no-files-found: error

  sysroot-run:
    needs: sysroot
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            triple: x86_64-w64-mingw32
            pixi: pixi-x86_64-pc-windows-msvc.exe
          - os: windows-11-arm
            triple: aarch64-w64-mingw32
            pixi: pixi-aarch64-pc-windows-msvc.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xclang-sysroot
          path: channel/noarch
      - name: install pixi
        run: |
          curl -fsSL -o pixi.exe https://github.com/prefix-dev/pixi/releases/download/v0.81.0/${{ matrix.pixi }}
          echo "$PWD" >> "$GITHUB_PATH"
      - name: create environment
        run: |
          channel="file:///$(cygpath -m "$PWD/channel")"
          pixi init tenv -c "$channel" -c conda-forge
          cd tenv
          pixi add xclang-sysroot-${{ matrix.triple }} clang lld llvm-tools
      - name: compile, link and run
        env:
          XCLANG_TRIPLE: ${{ matrix.triple }}
        run: |
          cd tenv
          pixi run bash -c 'PREFIX=$CONDA_PREFIX bash ../recipes/xclang-bootstrap/test.sh && ./hello.exe'

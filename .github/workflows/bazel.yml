name: bazel

# The Bazel module (packages/bazel) on a machine of every host:
# tests/bazel's tests, then tests/bazel.ts's checks of the actions' keys and
# of the module as the registry and git_override have it; and every host's
# toolchain for every other target it builds for, tests/bazel's tests (and,
# from Linux x64 to Windows x64, kotatsu's) cross-compiled there and run on a
# machine of the target (tests/bazel-cross.ts).
#
#   by hand         with the archives packages/bazel/bazel/versions.bzl names
#   main.yml        with a run's archives (dist-run), unpacked and named by
#                   XCLANG_ROOT and the like, before they are released
#   a published     the module of that release (its tree, with the digests
#   release, or     of its SHA256SUMS), then published to the clice Bazel
#   by hand with    registry, https://bazel.clice.io, through clice-io/bazel's
#   its tag         action

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release whose module to test and publish to bazel.clice.io, e.g. 23.1.2.5
        type: string
        default: ""
  workflow_call:
    inputs:
      dist-run:
        description: Run whose dist-<host> archives the module is tested with
        type: string
        required: true

permissions:
  contents: read
  actions: read

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  module:
    name: module (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        host:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-w64-mingw32
          - aarch64-w64-mingw32
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    runs-on: ${{ fromJSON('{"x86_64-unknown-linux-gnu":"ubuntu-24.04","aarch64-unknown-linux-gnu":"ubuntu-24.04-arm","x86_64-w64-mingw32":"windows-2025","aarch64-w64-mingw32":"windows-11-arm","aarch64-apple-darwin":"macos-15","x86_64-apple-darwin":"macos-15-intel"}')[matrix.host] }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install -g @bazel/bazelisk
      # The tag's tree names the release before it: the digests are known
      # only once its archives are.
      - name: Release digests
        if: env.TAG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p SHA256SUMS -D "$RUNNER_TEMP"
          node scripts/bazel.ts versions "$RUNNER_TEMP/SHA256SUMS"
      - uses: actions/download-artifact@v8
        if: inputs.dist-run
        with:
          name: dist-${{ matrix.host }}
          path: ${{ runner.temp }}/dist
          run-id: ${{ inputs.dist-run }}
          github-token: ${{ github.token }}
      # Windows' own tar (bsdtar), as test.yml unpacks them.
      - name: Unpack
        if: inputs.dist-run
        run: |
          tar=tar; [[ "$RUNNER_OS" == Windows ]] && tar=/c/Windows/System32/tar.exe
          dir="$RUNNER_TEMP/unpacked"; mkdir -p "$dir"
          for a in "$RUNNER_TEMP"/dist/xclang-*.tar.xz "$RUNNER_TEMP"/dist/libclang-*.tar.xz; do "$tar" -xf "$a" -C "$dir"; done
          [[ "$RUNNER_OS" == Windows ]] && dir="$(cygpath -m "$dir")"
          env="--repo_env=XCLANG_ROOT=$dir/xclang --repo_env=XCLANG_LIBCLANG_ROOT=$dir/libclang"
          [[ -d "$dir/libclang-asan" ]] && env="$env --repo_env=XCLANG_LIBCLANG_ASAN_ROOT=$dir/libclang-asan"
          echo "REPO_ENV=$env" >> "$GITHUB_ENV"
      - name: Test
        working-directory: tests/bazel
        run: |
          # Windows: a short output root, and runfiles as symlinks.
          startup=(); [[ "$RUNNER_OS" == Windows ]] && startup=(--output_user_root=C:/b --windows_enable_symlinks)
          bazel "${startup[@]}" test //... $REPO_ENV --disk_cache="$RUNNER_TEMP/disk"
          bazel "${startup[@]}" test -c opt //... $REPO_ENV --disk_cache="$RUNNER_TEMP/disk"
          # A GSYM, read by the toolchain's llvm-gsymutil through bazel run.
          # (Git Bash would make //symbols a Windows path.)
          gsym="$PWD/bazel-bin/symbols/hello.gsym"; [[ "$RUNNER_OS" == Windows ]] && gsym="$(cygpath -m "$gsym")"
          MSYS_NO_PATHCONV=1 bazel "${startup[@]}" build --strip=never //symbols:hello_symbols $REPO_ENV --disk_cache="$RUNNER_TEMP/disk"
          MSYS_NO_PATHCONV=1 bazel "${startup[@]}" run $REPO_ENV --disk_cache="$RUNNER_TEMP/disk" @xclang//bazel:llvm-gsymutil -- "$gsym" | grep '"main"'
      # gdb, for tests/bazel.ts's debugger checks.
      - name: gdb
        if: ${{ runner.os == 'Linux' && !inputs.dist-run }}
        run: command -v gdb || { sudo apt-get update -q && sudo apt-get install -y -q gdb; }
      # Keys of the downloaded archives: a run's unpacked ones are not
      # named by packages/bazel/bazel/versions.bzl.
      - name: Cache keys and inputs
        if: ${{ !inputs.dist-run }}
        run: node tests/bazel.ts --disk-cache "$RUNNER_TEMP/disk"

  # Built here, run by the run job on a machine of the target: macOS targets
  # build on macOS hosts only. Not for a run's archives, whose libclang is the
  # host's only.
  cross:
    if: ${{ !inputs.dist-run }}
    name: cross (${{ matrix.host }} to ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        host: &hosts
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-w64-mingw32
          - aarch64-w64-mingw32
          - aarch64-apple-darwin
          - x86_64-apple-darwin
        target: *hosts
        exclude:
          - { host: x86_64-unknown-linux-gnu, target: x86_64-unknown-linux-gnu }
          - { host: aarch64-unknown-linux-gnu, target: aarch64-unknown-linux-gnu }
          - { host: x86_64-w64-mingw32, target: x86_64-w64-mingw32 }
          - { host: aarch64-w64-mingw32, target: aarch64-w64-mingw32 }
          - { host: aarch64-apple-darwin, target: aarch64-apple-darwin }
          - { host: x86_64-apple-darwin, target: x86_64-apple-darwin }
          - { host: x86_64-unknown-linux-gnu, target: aarch64-apple-darwin }
          - { host: x86_64-unknown-linux-gnu, target: x86_64-apple-darwin }
          - { host: aarch64-unknown-linux-gnu, target: aarch64-apple-darwin }
          - { host: aarch64-unknown-linux-gnu, target: x86_64-apple-darwin }
          - { host: x86_64-w64-mingw32, target: aarch64-apple-darwin }
          - { host: x86_64-w64-mingw32, target: x86_64-apple-darwin }
          - { host: aarch64-w64-mingw32, target: aarch64-apple-darwin }
          - { host: aarch64-w64-mingw32, target: x86_64-apple-darwin }
    runs-on: ${{ fromJSON('{"x86_64-unknown-linux-gnu":"ubuntu-24.04","aarch64-unknown-linux-gnu":"ubuntu-24.04-arm","x86_64-w64-mingw32":"windows-2025","aarch64-w64-mingw32":"windows-11-arm","aarch64-apple-darwin":"macos-15","x86_64-apple-darwin":"macos-15-intel"}')[matrix.host] }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install -g @bazel/bazelisk
      - name: Release digests
        if: env.TAG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p SHA256SUMS -D "$RUNNER_TEMP"
          node scripts/bazel.ts versions "$RUNNER_TEMP/SHA256SUMS"
      - name: Build
        run: node tests/bazel-cross.ts build "${{ matrix.target }}" "$RUNNER_TEMP/out/${{ matrix.host }}/tests"
      # The latest kotatsu of the clice registry, its tests among the rest of
      # it (other test rules than cc_test build for another target only on
      # any execution platform: Bazel's legacy test toolchain).
      - name: kotatsu
        if: matrix.host == 'x86_64-unknown-linux-gnu' && matrix.target == 'x86_64-w64-mingw32'
        run: |
          node tests/bazel-cross.ts registry kotatsu "$RUNNER_TEMP/kotatsu"
          node tests/bazel-cross.ts build "${{ matrix.target }}" "$RUNNER_TEMP/out/${{ matrix.host }}/kotatsu" \
            --workspace "$RUNNER_TEMP/kotatsu" -- --@bazel_tools//tools/test:incompatible_use_default_test_toolchain=false
      - uses: actions/upload-artifact@v7
        with:
          name: cross-${{ matrix.host }}-to-${{ matrix.target }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 7

  # What every other host built for this target, run here.
  run:
    needs: cross
    if: ${{ !cancelled() && !inputs.dist-run }}
    name: run (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: *hosts
    runs-on: ${{ fromJSON('{"x86_64-unknown-linux-gnu":"ubuntu-24.04","aarch64-unknown-linux-gnu":"ubuntu-24.04-arm","x86_64-w64-mingw32":"windows-2025","aarch64-w64-mingw32":"windows-11-arm","aarch64-apple-darwin":"macos-15","x86_64-apple-darwin":"macos-15-intel"}')[matrix.target] }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # <host>/tests, <host>/kotatsu: short paths, for Windows.
      - uses: actions/download-artifact@v8
        with:
          pattern: cross-*-to-${{ matrix.target }}
          path: ${{ runner.temp }}/c
          merge-multiple: true
      - name: Run
        run: node tests/bazel-cross.ts run "$RUNNER_TEMP/c"

  publish:
    if: ${{ inputs.tag || github.event.release.tag_name }}
    needs: [module, cross, run]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Module archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p SHA256SUMS -D "$RUNNER_TEMP"
          node scripts/bazel.ts archive "$RUNNER_TEMP/SHA256SUMS" dist
      - uses: clice-io/bazel@main
        with:
          archives: dist/xclang-bazel-*.tar.gz
          token: ${{ secrets.UPLOAD_BAZEL }}

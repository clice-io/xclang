name: test-rfm

# A test of the release flow (not merged): a draft of fake archives of
# 23.1.3.<revision>, drafted by stage-draft.yml from release/23.1.3.<revision>.

on:
  push:
    branches: ["release/23.1.3.99*"]

permissions:
  contents: read
  actions: read

jobs:
  fake:
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.v.outputs.revision }}
    steps:
      - id: v
        run: |
          version=${GITHUB_REF#refs/heads/release/}
          echo "revision=${version##*.}" | tee -a "$GITHUB_OUTPUT"
          mkdir dist profile
          for f in xclang-$version-x86_64-unknown-linux-gnu.tar.xz libclang-$version-x86_64-unknown-linux-gnu.tar.xz llvm-option-inc-$version.tar.xz; do
            echo "$f" | xz > "dist/$f"
          done
          echo fake > profile/profile.profdata
      - uses: actions/upload-artifact@v7
        with:
          name: dist-fake
          path: dist
      - uses: actions/upload-artifact@v7
        with:
          name: profile
          path: profile

  release:
    needs: fake
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/stage-draft.yml
    with:
      revision: ${{ needs.fake.outputs.revision }}
      dist-run: ${{ github.run_id }}
      profile-run: ${{ github.run_id }}

name: main

# The whole release pipeline, started by hand. Each stage is a reusable
# workflow; `stages` picks which run, and the *-run inputs take a stage's
# artifacts from an earlier run instead of building them again.
#
#   runtimes       runtimes of every target
#   instrumented   the clang and lld that record the profile (Linux x64)
#   train          the training run, giving `profile`
#   toolchain      every host's toolchain and libclang
#   asan           the ASan libclang of Linux x64 and macOS arm64
#   package        every host's release archives
#   test           every host's archive checked on a machine of that host
#   release        a draft release of everything (needs the profile)

on:
  workflow_dispatch:
    inputs:
      stages:
        description: "Comma-separated stages: runtimes, instrumented, train, toolchain, asan, package, test, release"
        type: string
        default: runtimes,instrumented,train,toolchain,asan,package,test
      runtimes:
        description: JSON list of the runtimes units to build; the others come from reuse-run
        type: string
        default: '["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-w64-mingw32", "aarch64-w64-mingw32", "darwin"]'
      hosts:
        description: JSON list of the hosts to build a toolchain for
        type: string
        default: '["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-w64-mingw32", "aarch64-w64-mingw32", "aarch64-apple-darwin", "x86_64-apple-darwin"]'
      reuse-run:
        description: Run whose artifacts stand in for the stages not run
        type: string
        default: ""
      profile-run:
        description: Run holding the profile when train does not run; none builds without PGO
        type: string
        default: none
      revision:
        description: Release revision, the last component of <llvm version>.<revision>
        type: string
        default: "1"

permissions:
  contents: read
  actions: read

jobs:
  runtimes:
    if: contains(inputs.stages, 'runtimes')
    uses: ./.github/workflows/runtimes.yml
    with:
      build: ${{ inputs.runtimes }}
      reuse-run: ${{ inputs.reuse-run }}

  instrumented:
    needs: runtimes
    if: ${{ !cancelled() && contains(inputs.stages, 'instrumented') && needs.runtimes.result != 'failure' }}
    uses: ./.github/workflows/toolchain.yml
    with:
      host: x86_64-unknown-linux-gnu
      mode: instrumented
      runtimes-run: ${{ needs.runtimes.result == 'success' && github.run_id || inputs.reuse-run }}

  train:
    needs: [runtimes, instrumented]
    if: ${{ !cancelled() && contains(inputs.stages, 'train') && !contains(needs.*.result, 'failure') }}
    uses: ./.github/workflows/train.yml
    with:
      runtimes-run: ${{ needs.runtimes.result == 'success' && github.run_id || inputs.reuse-run }}
      instrumented-run: ${{ needs.instrumented.result == 'success' && github.run_id || inputs.reuse-run }}

  toolchain:
    needs: [runtimes, train]
    if: ${{ !cancelled() && contains(inputs.stages, 'toolchain') && !contains(needs.*.result, 'failure') }}
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(inputs.hosts) }}
    uses: ./.github/workflows/toolchain.yml
    with:
      host: ${{ matrix.host }}
      runtimes-run: ${{ needs.runtimes.result == 'success' && github.run_id || inputs.reuse-run }}
      profile-run: ${{ needs.train.result == 'success' && github.run_id || inputs.profile-run }}

  asan:
    needs: runtimes
    if: ${{ !cancelled() && contains(inputs.stages, 'asan') && needs.runtimes.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        host: [x86_64-unknown-linux-gnu, aarch64-apple-darwin]
    uses: ./.github/workflows/toolchain.yml
    with:
      host: ${{ matrix.host }}
      mode: asan
      runtimes-run: ${{ needs.runtimes.result == 'success' && github.run_id || inputs.reuse-run }}

  package:
    needs: [runtimes, toolchain, asan]
    if: ${{ !cancelled() && contains(inputs.stages, 'package') && !contains(needs.*.result, 'failure') }}
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(inputs.hosts) }}
    uses: ./.github/workflows/package.yml
    with:
      host: ${{ matrix.host }}
      revision: ${{ inputs.revision }}
      runtimes-run: ${{ needs.runtimes.result == 'success' && github.run_id || inputs.reuse-run }}
      toolchain-run: ${{ needs.toolchain.result == 'success' && github.run_id || inputs.reuse-run }}

  test:
    needs: package
    if: ${{ !cancelled() && contains(inputs.stages, 'test') && needs.package.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(inputs.hosts) }}
    uses: ./.github/workflows/test.yml
    with:
      host: ${{ matrix.host }}
      dist-run: ${{ needs.package.result == 'success' && github.run_id || inputs.reuse-run }}

  release:
    needs: [train, package, test]
    if: ${{ !cancelled() && contains(inputs.stages, 'release') && !contains(needs.*.result, 'failure') }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      revision: ${{ inputs.revision }}
      dist-run: ${{ needs.package.result == 'success' && github.run_id || inputs.reuse-run }}
      profile-run: ${{ needs.train.result == 'success' && github.run_id || inputs.profile-run }}

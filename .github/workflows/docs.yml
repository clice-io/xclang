name: docs

# docs/ to docs.clice.io/xclang: clice-io/docs's sync action copies docs/en
# into that repository as en/xclang, in a pull request that merges itself
# once the site builds. On every push to main that changes docs/; checks
# first that the docs' code blocks are examples/'s files and that their
# links reach pages and headings (tests/docs.ts).

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node tests/docs.ts
      - uses: clice-io/docs@main
        with:
          project: xclang
          token: ${{ secrets.CLICE_DOCS }}

name: docs

# tests/docs/docs.ts on every branch: the docs' files and command blocks are
# examples/'s files and examples.yml's steps, their links reach pages and
# headings, their status cells are status words. On main, then, docs/ to
# docs.clice.io/xclang: clice-io/docs's sync action copies docs/en into that
# repository as en/xclang, in a pull request that merges itself once the
# site builds (none when nothing changed).

on:
  push:
    paths:
      - "docs/**"
      - "examples/**"
      - "tests/docs/**"
      - ".github/workflows/**"
      - "README.md"
      - "README.zh-CN.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "packages/README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node tests/docs/docs.ts

  publish:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: clice-io/docs@main
        with:
          project: xclang
          token: ${{ secrets.CLICE_DOCS }}

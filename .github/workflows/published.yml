name: published

# Publishing a release, and what follows: the release as its users get it,
# on every channel. A release is published by merging its pull request,
# release/<version> into main as a merge commit: that push brings the
# draft's commit (stage-draft.yml) onto main, and the release job
# publishes the draft, which tags that commit. So every tag is in main's
# history, and a draft deleted before its pull request merges leaves
# nothing on main.
#
#   1. test-bazel.yml with the release's archives, then the module of its
#      tag (packages/bazel/bazel.ts archive) published to the clice Bazel
#      registry, https://bazel.clice.io, through clice-io/bazel's action;
#   2. test-cmake.yml with its archives and its tag fetched from GitHub, as
#      a user's FetchContent does;
#   3. conda.yml: its packages, build 0, published to conda.clice.io;
#   4. the `latest` branch moved to its tag, which the docs' FetchContent
#      fetches;
#   5. examples.yml, the docs' commands against it, once conda.clice.io
#      serves it.
#
# By hand with a tag, it tests the release again; with publish, it also
# publishes to each channel that does not have the version yet (a channel
# refuses a version it has: conda's packages, made again, are other bytes),
# and publishes the draft of the tag first, when its commit is in main's
# history (a release pull request that was squashed, then merged again).
#
# Run again (a failed job, or the whole run), it finishes what it began: a
# draft published already by the first try is taken as published, and a
# channel that has the release is not published to again. What a failed job
# leaves published is in .claude/skills/release/troubleshooting.md.

on:
  # The draft's commit changes versions.bzl, to the release.
  push:
    branches: [main]
    paths: [packages/bazel/bazel/versions.bzl]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release, e.g. 23.1.2.8
        type: string
        required: true
      publish:
        description: Publish to bazel.clice.io and conda.clice.io, and move `latest`
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  # The release: by hand, the tag given; on a push, the draft whose commit
  # the push brought into main's history, published here. Its version goes
  # to the other jobs (and the calls, which read no env) as an output.
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      publish: ${{ steps.tag.outputs.publish }}
      bazel-has: ${{ steps.channels.outputs.bazel-has }}
      conda-has: ${{ steps.channels.outputs.conda-has }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          BEFORE: ${{ github.event.before }}
        run: |
          retry() { node tests/lib/retry.ts "$@"; }
          # <b> is in the history of <a>.
          reaches() { local s; s=$(retry gh api "repos/$GITHUB_REPOSITORY/compare/$2...$1" -q .status) && [[ "$s" == ahead || "$s" == identical ]]; }
          # Every release, draft or not, with its commit.
          retry gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            -q '.[] | [.tag_name, (.draft | tostring), .target_commitish] | @tsv' > releases.tsv
          publish() {  # <tag>: the draft published, which creates its tag at its commit
            retry gh release edit "$1" -R "$GITHUB_REPOSITORY" --draft=false --latest
            echo "published $1" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            IFS=$'\t' read -r _ draft sha < <(grep -P "^\Q$INPUT_TAG\E\t" releases.tsv) \
              || { echo "::error::no release $INPUT_TAG"; exit 1; }
            if [[ "$draft" == true ]]; then
              if [[ "$INPUT_PUBLISH" != true ]]; then echo "::error::$INPUT_TAG is a draft; publish=true publishes it"; exit 1; fi
              if ! reaches "$(git rev-parse HEAD)" "$sha"; then
                echo "::error::the draft's commit $sha is not in main's history: its pull request merges it (a merge commit)"
                exit 1
              fi
              publish "$INPUT_TAG"
            fi
            echo "tag=$INPUT_TAG" | tee -a "$GITHUB_OUTPUT"
            echo "publish=$INPUT_PUBLISH" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          # The releases whose commit this push brought into main's history:
          # a draft, published here, or one a try before published.
          came=()
          while IFS=$'\t' read -r tag draft sha; do
            if [[ "$sha" =~ ^[0-9a-f]{40}$ ]] && ! reaches "$BEFORE" "$sha" && reaches "$GITHUB_SHA" "$sha"; then came+=("$tag:$draft"); fi
          done < releases.tsv
          if (( ${#came[@]} > 1 )); then
            echo "::error::the commits of releases ${came[*]} came into main's history at once; publish one by hand"
            exit 1
          fi
          if (( ${#came[@]} == 0 )); then
            # The module names a release that is still a draft: its pull
            # request was squashed, which brings its files but not its
            # commit, so that the tag would not be in main's history.
            version=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' packages/bazel/bazel/versions.bzl)
            if grep -qP "^\Q$version\E\ttrue\t" releases.tsv; then
              echo "::error::main's packages/bazel names $version, a draft whose commit this push did not bring: was its pull request squashed? A pull request of release/$version into main, merged as a merge commit, brings it; then published.yml by hand, tag $version, publish (.claude/skills/release/troubleshooting.md)"
              exit 1
            fi
            echo "no release's commit came into main's history" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tag=${came[0]%:*}
          if [[ "${came[0]##*:}" == true ]]; then publish "$tag"; else echo "$tag: published by a try before" | tee -a "$GITHUB_STEP_SUMMARY"; fi
          echo "tag=$tag" | tee -a "$GITHUB_OUTPUT"
          echo "publish=true" | tee -a "$GITHUB_OUTPUT"
      # A release just published is not served by its download URLs at
      # once: test-cmake.yml's download of SHA256SUMS answered 404 37 s
      # after 23.1.5.2 was published. The jobs after this one start once it
      # is (ten minutes at most).
      - name: The release served
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/SHA256SUMS"
          for i in $(seq 60); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -L -A "xclang/ci" "$url" || true)
            [[ "$code" == 200 ]] && { echo "$url: served after $(( (i - 1) * 10 )) s"; exit 0; }
            sleep 10
          done
          echo "::error::$url: HTTP $code ten minutes after the release was published"
          exit 1
      # What a channel has already, which a re-run does not publish again:
      # the module's version on bazel.clice.io, the packages of every subdir
      # on conda.clice.io.
      - id: channels
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          has() { local body; body=$(curl -sSfL --retry 3 --retry-all-errors -A "xclang/ci" "$1") && grep -qF "$2" <<< "$body"; }
          bazel=false; has "https://bazel.clice.io/modules/xclang/metadata.json" "\"$TAG\"" && bazel=true
          conda=true
          for subdir in linux-64 linux-aarch64 win-64 win-arm64 osx-arm64 osx-64; do
            has "https://conda.clice.io/$subdir/repodata.json" "\"xclang-$TAG-" || conda=false
          done
          echo "bazel-has=$bazel" | tee -a "$GITHUB_OUTPUT"
          echo "conda-has=$conda" | tee -a "$GITHUB_OUTPUT"

  bazel:
    needs: release
    if: needs.release.outputs.tag != ''
    uses: ./.github/workflows/test-bazel.yml
    with:
      release: ${{ needs.release.outputs.tag }}

  cmake:
    needs: release
    if: needs.release.outputs.tag != ''
    uses: ./.github/workflows/test-cmake.yml
    with:
      release: ${{ needs.release.outputs.tag }}
      git-ref: ${{ needs.release.outputs.tag }}

  conda:
    needs: release
    if: needs.release.outputs.tag != ''
    uses: ./.github/workflows/conda.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      build: "0"
      publish: ${{ needs.release.outputs.publish == 'true' && needs.release.outputs.conda-has != 'true' }}
    secrets: inherit

  bazel-registry:
    needs: [release, bazel]
    if: needs.release.outputs.publish == 'true' && needs.release.outputs.bazel-has != 'true'
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Module archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tests/lib/retry.ts gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p SHA256SUMS -D "$RUNNER_TEMP" --clobber
          node packages/bazel/bazel.ts archive "$RUNNER_TEMP/SHA256SUMS" dist
      - uses: clice-io/bazel@main
        with:
          archives: dist/xclang-bazel-*.tar.gz
          token: ${{ secrets.UPLOAD_BAZEL }}

  # Forward only: a release is never older than the one before it, and its
  # tag descends from the one before through main (stage-draft.yml);
  # FetchContent rebases a `latest` checkout onto it, which a forced move
  # would break. Not after a failed test of the module either, which skips
  # bazel-registry and is no failure of it.
  latest:
    needs: [release, bazel, cmake, conda, bazel-registry]
    if: ${{ !cancelled() && needs.release.outputs.publish == 'true' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Move latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(node tests/lib/retry.ts gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" -q .sha)
          node tests/lib/retry.ts gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/latest" -f sha="$sha" -F force=false
          echo "latest: $TAG ($sha)" | tee -a "$GITHUB_STEP_SUMMARY"
      # The channel's index, which the conda action's publishing updates.
      - name: conda.clice.io serves it
        run: |
          for i in $(seq 60); do
            curl -sSfL -A "xclang/ci" https://conda.clice.io/linux-64/repodata.json | grep -q "\"xclang-$TAG-" && exit 0
            sleep 30
          done
          echo "::error::conda.clice.io has no xclang $TAG after 30 minutes"; exit 1

  examples:
    needs: [release, latest]
    if: ${{ !cancelled() && needs.release.outputs.tag != '' && (needs.latest.result == 'success' || needs.release.outputs.publish != 'true') }}
    uses: ./.github/workflows/examples.yml

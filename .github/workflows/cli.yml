name: cli

# xclang's own command (cli/, Rust). The build job builds it for every host
# with a released xclang as the C compiler and linker (cli/cli.ts):
# Linux and Windows from Linux x64, macOS on macOS arm64, as the
# cli-build-* artifacts, and runs its rustfmt, clippy and unit tests. The
# test jobs then check it in a toolchain, on a machine of each host
# (tests/cli/cli.ts): both vendor SDKs fetched, C, C++ and Objective-C
# programs cross-compiled against them, target add and remove against a
# test index; from Linux, cli/ itself cross-built with cargo for macOS and
# the MSVC ABI against the SDKs (tests/cli/cargo.ts). The programs run on
# macOS and Windows (on-target.yml). Only programs leave a job, never an
# SDK.
#
#   release.yml     the build, for the archives (build-only); after them,
#                   the tests of the command the archives carry (dist-run)
#   checks.yml,     the build, and the tests of it in the latest release's
#   weekly.yml,     toolchain; weekly too, as the vendors' downloads change
#   by hand         under it

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        description: The release the binaries say they are of, <llvm version>.<revision>
        type: string
        default: ""
      build-only:
        description: Build, without the tests
        type: boolean
        default: false
      dist-run:
        description: Run whose archives' command to test, without building it
        type: string
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: build on ${{ matrix.runner }}
    if: ${{ !inputs.dist-run }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, machine: linux }
          - { runner: macos-15, machine: macos }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Build
        run: node cli/cli.ts ${{ inputs.revision && format('--revision {0}', inputs.revision) || '' }}
      - name: rustfmt, clippy, unit tests
        if: ${{ matrix.machine == 'linux' }}
        working-directory: cli
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features maintainer -- -D warnings
          cargo test --features maintainer
      - uses: actions/upload-artifact@v7
        with:
          name: cli-build-${{ matrix.machine }}
          path: work/out/cli-*
          if-no-files-found: error

  test:
    name: test on ${{ matrix.host }}
    needs: build
    if: ${{ !cancelled() && !inputs.build-only && needs.build.result != 'failure' }}
    runs-on: ${{ fromJSON('{"x86_64-unknown-linux-gnu":"ubuntu-24.04","aarch64-unknown-linux-gnu":"ubuntu-24.04-arm","x86_64-w64-mingw32":"windows-2025","aarch64-w64-mingw32":"windows-11-arm","aarch64-apple-darwin":"macos-15","x86_64-apple-darwin":"macos-15-intel"}')[matrix.host] }}
    strategy:
      fail-fast: false
      matrix:
        host: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, x86_64-w64-mingw32, aarch64-w64-mingw32, aarch64-apple-darwin, x86_64-apple-darwin]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # A run's archives with their command, or the latest release's
      # toolchain with the one built above.
      - uses: ./.github/actions/archives
        with:
          host: ${{ matrix.host }}
          dist-run: ${{ inputs.dist-run }}
      - uses: actions/download-artifact@v8
        if: ${{ !inputs.dist-run }}
        with:
          pattern: cli-build-*
          path: built
          merge-multiple: true
      - name: The command built
        if: ${{ !inputs.dist-run }}
        run: |
          cp built/cli-${{ matrix.host }}/xclang* "$XCLANG_TREE/bin/"
          chmod +x "$XCLANG_TREE"/bin/xclang*
      - name: Test
        run: node tests/cli/cli.ts --tree "$XCLANG_TREE" --out "$RUNNER_TEMP/programs"
      # cargo with xclang for the SDKs' targets, from Linux (docs/en/integrations/cargo.md).
      - name: cargo for macOS and MSVC targets
        if: ${{ matrix.host == 'x86_64-unknown-linux-gnu' }}
        run: node tests/cli/cargo.ts --tree "$XCLANG_TREE" --out "$RUNNER_TEMP/programs"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: programs-cli-${{ matrix.host }}
          path: ${{ runner.temp }}/programs
          if-no-files-found: ignore

  run:
    needs: test
    if: ${{ !cancelled() && !inputs.build-only }}
    uses: ./.github/workflows/on-target.yml
    with:
      targets: '["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]'
      pattern: programs-cli-*

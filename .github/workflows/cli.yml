name: cli

# xclang's own command (xclang/, Rust). The build job builds it for every host
# with a released xclang as the C compiler and linker (xclang/build.ts):
# Linux and Windows from Linux x64, macOS on macOS arm64, as the
# cli-build-* artifacts, and runs its rustfmt, clippy and unit tests; a
# second machine builds it again, and same-bytes checks that both gave the
# same bytes. The
# test jobs then check it in a toolchain, on a machine of each host
# (tests/cli/cli.ts): both vendor SDKs fetched, C, C++ and Objective-C
# programs cross-compiled against them, target add and remove against a
# test index; from Linux x64, Windows x64 and macOS arm64, `xclang cargo`
# for every target of it, with no cargo config: examples/cargo, a crate of
# C, C++, CMake and bindgen, and from Linux xclang/ itself
# (tests/cli/cargo.ts). The programs run on a machine of their target
# (on-target.yml). Only programs leave a job, never an SDK.
#
#   release.yml     the build, for the archives (build-only); after them,
#                   the tests of the command the archives carry (dist-run)
#   checks.yml,     the build, and the tests of it in the latest release's
#   weekly.yml,     toolchain; weekly too, as the vendors' downloads change
#   by hand         under it

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        description: The release the binaries say they are of, <llvm version>.<revision>
        type: string
        default: ""
      build-only:
        description: Build, without the tests
        type: boolean
        default: false
      dist-run:
        description: Run whose archives' command to test, without building it
        type: string
        default: ""
      artifact:
        description: The build's artifacts, <artifact>-linux and <artifact>-macos, named apart from another call's in the same run
        type: string
        default: cli-build

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: build on ${{ matrix.runner }}${{ matrix.again && ', again' || '' }}
    if: ${{ !inputs.dist-run }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        machine: [linux, macos]
        again: [false, true]
        include:
          - { machine: linux, runner: ubuntu-24.04 }
          - { machine: macos, runner: macos-15 }
    steps:
      # Built again on another machine, as another would build it: in
      # another directory, with another CARGO_HOME, at another time.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: ${{ matrix.again && 'elsewhere' || '' }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Build
        working-directory: ${{ matrix.again && 'elsewhere' || '.' }}
        env:
          AGAIN: ${{ matrix.again }}
        run: |
          [ "$AGAIN" = true ] && export CARGO_HOME=$RUNNER_TEMP/cargo
          node xclang/build.ts ${{ inputs.revision && format('--revision {0}', inputs.revision) || '' }}
          mkdir -p "$RUNNER_TEMP/digests"
          (cd work/out && find cli-* -type f -print0 | LC_ALL=C sort -z | xargs -0 shasum -a 256) > "$RUNNER_TEMP/digests/${{ matrix.machine }}-${{ matrix.again && 'again' || 'first' }}.txt"
      - name: rustfmt, clippy, unit tests
        if: ${{ matrix.machine == 'linux' && !matrix.again }}
        working-directory: xclang
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features maintainer -- -D warnings
          cargo test --features maintainer
      - uses: actions/upload-artifact@v7
        if: ${{ !matrix.again }}
        with:
          name: ${{ inputs.artifact || 'cli-build' }}-${{ matrix.machine }}
          path: work/out/cli-*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ inputs.artifact || 'cli-build' }}-${{ matrix.machine }}-${{ matrix.again && 'again' || 'first' }}
          path: ${{ runner.temp }}/digests
          retention-days: 7

  # Both builds of each machine gave the same bytes: every binary and
  # license file.
  same-bytes:
    name: the same bytes from both builds
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-${{ inputs.artifact || 'cli-build' }}-*
          path: digests
          merge-multiple: true
      - name: Compare
        run: |
          for machine in linux macos; do
            grep -v /licenses/ "digests/$machine-first.txt" | tee -a "$GITHUB_STEP_SUMMARY"
            diff "digests/$machine-first.txt" "digests/$machine-again.txt"
          done

  test:
    name: test on ${{ matrix.host }}
    needs: build
    if: ${{ !cancelled() && !inputs.build-only && needs.build.result != 'failure' }}
    runs-on: ${{ fromJSON('{"x86_64-unknown-linux-gnu":"ubuntu-24.04","aarch64-unknown-linux-gnu":"ubuntu-24.04-arm","x86_64-w64-mingw32":"windows-2025","aarch64-w64-mingw32":"windows-11-arm","aarch64-apple-darwin":"macos-15","x86_64-apple-darwin":"macos-15-intel"}')[matrix.host] }}
    strategy:
      fail-fast: false
      matrix:
        host: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, x86_64-w64-mingw32, aarch64-w64-mingw32, aarch64-apple-darwin, x86_64-apple-darwin]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # A run's archives with their command, or the latest release's
      # toolchain with the one built above.
      - uses: ./.github/actions/archives
        with:
          host: ${{ matrix.host }}
          dist-run: ${{ inputs.dist-run }}
      - uses: actions/download-artifact@v8
        if: ${{ !inputs.dist-run }}
        with:
          pattern: ${{ inputs.artifact || 'cli-build' }}-*
          path: built
          merge-multiple: true
      - name: The command built
        if: ${{ !inputs.dist-run }}
        run: |
          cp built/cli-${{ matrix.host }}/xclang* "$XCLANG_TREE/bin/"
          chmod +x "$XCLANG_TREE"/bin/xclang*
      - name: Test
        run: node tests/cli/cli.ts --tree "$XCLANG_TREE" --out "$RUNNER_TEMP/programs"
      # xclang cargo for every target (docs/en/integrations/cargo.md); the
      # runners have CMake, Ninja and a libclang for bindgen.
      - name: xclang cargo
        if: ${{ contains(fromJSON('["x86_64-unknown-linux-gnu", "x86_64-w64-mingw32", "aarch64-apple-darwin"]'), matrix.host) }}
        run: node tests/cli/cargo.ts --tree "$XCLANG_TREE" --out "$RUNNER_TEMP/programs"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: programs-cli-${{ matrix.host }}
          path: ${{ runner.temp }}/programs
          if-no-files-found: ignore

  run:
    needs: test
    if: ${{ !cancelled() && !inputs.build-only }}
    uses: ./.github/workflows/on-target.yml
    with:
      targets: '["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl", "x86_64-w64-mingw32", "aarch64-w64-mingw32", "aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]'
      pattern: programs-cli-*

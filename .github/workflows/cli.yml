name: cli

# xclang's own command (cli/, Rust), built for every host with a released
# xclang as the C compiler and linker (scripts/cli.ts): Linux and Windows
# from Linux x64, macOS on macOS arm64, as the cli-build-* artifacts. Then,
# unless called with build-only, on a machine of each host
# (tests/cli.ts): both vendor SDKs fetched, C, C++ and Objective-C
# programs cross-compiled against them, target add and remove against a
# test index; from Linux, cli/ itself cross-built with cargo for macOS and
# the MSVC ABI against the SDKs (tests/cargo.ts). The programs run on macOS
# and Windows. Only the programs leave a job, never an SDK.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        description: The release the binaries say they are of, <llvm version>.<revision>
        type: string
        default: ""
      build-only:
        description: Build, without the tests
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: build on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, machine: linux }
          - { runner: macos-15, machine: macos }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Build
        run: node scripts/cli.ts ${{ inputs.revision && format('--revision {0}', inputs.revision) || '' }}
      - name: rustfmt, clippy, unit tests
        if: ${{ matrix.machine == 'linux' }}
        working-directory: cli
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features maintainer -- -D warnings
          cargo test --features maintainer
      - uses: actions/upload-artifact@v7
        with:
          name: cli-build-${{ matrix.machine }}
          path: work/out/cli-*
          if-no-files-found: error

  test:
    name: test on ${{ matrix.host }}
    needs: build
    if: ${{ !inputs.build-only }}
    runs-on: ${{ fromJSON('{"x86_64-unknown-linux-gnu":"ubuntu-24.04","aarch64-unknown-linux-gnu":"ubuntu-24.04-arm","x86_64-w64-mingw32":"windows-2025","aarch64-w64-mingw32":"windows-11-arm","aarch64-apple-darwin":"macos-15","x86_64-apple-darwin":"macos-15-intel"}')[matrix.host] }}
    strategy:
      fail-fast: false
      matrix:
        host: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, x86_64-w64-mingw32, aarch64-w64-mingw32, aarch64-apple-darwin, x86_64-apple-darwin]
    defaults:
      run:
        shell: bash
    env:
      XCLANG: 23.1.2.6
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-build-*
          path: built
          merge-multiple: true
      # The toolchain the binary goes into, checked against the release's
      # SHA256SUMS; on Windows unpacked by Windows' own tar, as a user does.
      - name: xclang ${{ env.XCLANG }}
        run: |
          A=xclang-$XCLANG-${{ matrix.host }}.tar.xz
          cd "$RUNNER_TEMP"
          curl -sSfLO -A "xclang/ci" "https://github.com/clice-io/xclang/releases/download/$XCLANG/$A"
          curl -sSfLO -A "xclang/ci" "https://github.com/clice-io/xclang/releases/download/$XCLANG/SHA256SUMS"
          want=$(grep " $A\$" SHA256SUMS | cut -d' ' -f1)
          got=$( (sha256sum "$A" 2> /dev/null || shasum -a 256 "$A") | cut -d' ' -f1)
          [ "$got" = "$want" ] || { echo "$A: sha256 $got, expected $want"; exit 1; }
          case "$RUNNER_OS" in
            Windows) /c/Windows/System32/tar.exe -xf "$A"; T=$(cygpath -m "$PWD/xclang") ;;
            *) tar -xf "$A"; T=$PWD/xclang ;;
          esac
          cp "$GITHUB_WORKSPACE"/built/cli-${{ matrix.host }}/xclang* "$T/bin/"
          chmod +x "$T"/bin/xclang*
          echo "T=$T" >> "$GITHUB_ENV"
      - name: Test
        run: node tests/cli.ts --tree "$T" --out programs
      # cargo with xclang for the SDKs' targets, from Linux (docs/en/integrations/cargo.md).
      - name: cargo for macOS and MSVC targets
        if: ${{ matrix.host == 'x86_64-unknown-linux-gnu' }}
        run: node tests/cargo.ts --tree "$T" --out programs
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: sdk-programs-${{ matrix.host }}
          path: programs

  run:
    name: run on ${{ matrix.runner }}
    needs: test
    if: ${{ !cancelled() && !inputs.build-only }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, dir: macos/arm64 }
          - { runner: macos-15-intel, dir: macos/x86_64 }
          - { runner: windows-2025, dir: msvc/x86_64 }
          - { runner: windows-11-arm, dir: msvc/aarch64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: sdk-programs-*
          path: programs
      # Every host's programs for this machine.
      - name: Run
        run: node tests/cli.ts --run programs/*/${{ matrix.dir }}

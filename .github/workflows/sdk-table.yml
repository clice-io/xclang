name: sdk-table

# Append the SDK versions the vendors offer now to sdk/versions.json
# (sdk/update-versions.py): the updated table is the artifact, its new
# entries the summary; committing it is by hand. Runs when the script or this
# file changes (a workflow_dispatch needs the file on the default branch).

on:
  push:
    branches: [exp/sdk-fetch]
    paths: [sdk/update-versions.py, .github/workflows/sdk-table.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python sdk/update-versions.py 2>&1 | tee update.txt
      - name: Summary
        run: |
          { echo '```'; grep -E '^  \+|SDKs' update.txt; echo '```'; echo '```diff'; git diff --stat; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: versions.json
          path: sdk/versions.json

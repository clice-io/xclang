name: sdk-fetch

# Probe: cross-compile for macOS and for the MSVC ABI with vendor SDKs that
# each job downloads from the vendor itself (sdk/vendor-sdk.py). Only the
# programs built here travel between jobs, never an SDK or anything taken
# from one.

on:
  push:
    branches: [exp/sdk-fetch]
    paths: [sdk/**, .github/workflows/sdk-fetch.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  XCLANG: 23.1.2.5
  KOTATSU: d3b82f79499bd8e2e5e557f7bf7eca7a27b928b7

jobs:
  macos-linux:
    name: macOS ${{ matrix.sdk }} SDK, from Linux
    runs-on: ubuntu-24.04
    # ld64.lld 23.1.2 cannot read the 27.0 SDK's .tbd files (arm64e.x1).
    continue-on-error: ${{ matrix.sdk == '27.0' }}
    strategy:
      fail-fast: false
      matrix:
        sdk: ["26.5", "27.0"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: xclang
        run: echo "X=$(sdk/get-xclang.sh "$XCLANG" x86_64-unknown-linux-gnu "$RUNNER_TEMP")" >> "$GITHUB_ENV"
      - name: Fetch the SDK from Apple
        run: |
          python sdk/vendor-sdk.py macos catalog --last 4
          start=$SECONDS
          python sdk/vendor-sdk.py macos fetch --accept-license --version "${{ matrix.sdk }}" --cache "$RUNNER_TEMP" --out "$RUNNER_TEMP/MacOSX.sdk"
          echo "fetch + unpack: $((SECONDS - start)) s"
          du -sh "$RUNNER_TEMP/MacOSX.sdk"
          echo "SDK=$RUNNER_TEMP/MacOSX.sdk" >> "$GITHUB_ENV"
      - name: Build
        run: sdk/build-macos.sh "$X" "$SDK" out
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: macos-linux-${{ matrix.sdk }}
          path: out

  macos-windows:
    name: macOS 26.5 SDK, from Windows
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: xclang
        run: echo "X=$(sdk/get-xclang.sh "$XCLANG" x86_64-w64-mingw32 "$RUNNER_TEMP")" >> "$GITHUB_ENV"
      - name: Fetch the SDK from Apple
        run: |
          start=$SECONDS
          python sdk/vendor-sdk.py macos fetch --accept-license --version 26.5 --cache "$RUNNER_TEMP" --out "$RUNNER_TEMP/MacOSX.sdk"
          echo "fetch + unpack: $((SECONDS - start)) s"
          echo "SDK=$(cygpath -m "$RUNNER_TEMP/MacOSX.sdk")" >> "$GITHUB_ENV"
      - name: Build
        run: sdk/build-macos.sh "$X" "$SDK" out
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: macos-windows-26.5
          path: out

  macos-kotatsu:
    name: kotatsu for ${{ matrix.arch }} macOS, from Linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install cmake ninja
      - name: xclang, the SDK, kotatsu
        run: |
          echo "X=$(sdk/get-xclang.sh "$XCLANG" x86_64-unknown-linux-gnu "$RUNNER_TEMP")" >> "$GITHUB_ENV"
          python sdk/vendor-sdk.py macos fetch --accept-license --version 26.5 --cache "$RUNNER_TEMP" --out "$RUNNER_TEMP/MacOSX.sdk"
          git clone -q --filter=blob:none https://github.com/clice-io/kotatsu "$RUNNER_TEMP/kotatsu"
          git -C "$RUNNER_TEMP/kotatsu" checkout -q "$KOTATSU"
      - name: Build
        run: |
          cmake -S "$RUNNER_TEMP/kotatsu" -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/sdk/darwin.cmake" -DXCLANG_ROOT="$X" \
            -DMACOS_SDK="$RUNNER_TEMP/MacOSX.sdk" -DMACOS_ARCH=${{ matrix.arch }} -DKOTA_ENABLE_TEST=ON
          cmake --build build --target unit_tests system_tests
          mkdir -p out/${{ matrix.arch }}
          cp build/unit_tests build/system_tests out/${{ matrix.arch }}/
      - uses: actions/upload-artifact@v7
        with:
          name: macos-kotatsu-${{ matrix.arch }}
          path: out

  macos-run:
    name: run on ${{ matrix.runner }}
    needs: [macos-linux, macos-windows, macos-kotatsu]
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: x86_64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: macos-*
          path: art
      - name: kotatsu's sources, for its tests
        run: |
          git clone -q --filter=blob:none https://github.com/clice-io/kotatsu "$RUNNER_TEMP/kotatsu"
          git -C "$RUNNER_TEMP/kotatsu" checkout -q "$KOTATSU"
          echo "KOTATSU_SRC=$RUNNER_TEMP/kotatsu" >> "$GITHUB_ENV"
      - name: Run
        run: |
          sw_vers; uname -m
          fail=0
          for a in art/*; do
            echo "### $a"; cat "$a/build.txt" 2>/dev/null || true
            sdk/run.sh "$a/${{ matrix.arch }}" "$a" || fail=1
          done
          exit $fail
      - name: Code signatures
        if: ${{ !cancelled() }}
        run: |
          for f in art/*/${{ matrix.arch }}/hello-cpp art/*/${{ matrix.arch }}/objc art/*/${{ matrix.arch }}/unit_tests; do
            [ -f "$f" ] || continue
            # ld64.lld signs arm64 programs ad hoc; x86_64 ones need no signature.
            echo "== $f"; codesign -dv "$f" 2>&1 | grep -E 'Format|Signature|not signed' || true
            [ "${{ matrix.arch }}" = x86_64 ] || codesign --verify --verbose "$f"
          done

  msvc:
    name: MSVC ABI, from ${{ matrix.host.triple }}
    runs-on: ${{ matrix.host.runner }}
    strategy:
      fail-fast: false
      matrix:
        host:
          - { triple: x86_64-unknown-linux-gnu, runner: ubuntu-24.04 }
          - { triple: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }
          - { triple: aarch64-apple-darwin, runner: macos-15 }
          - { triple: x86_64-apple-darwin, runner: macos-15-intel }
          - { triple: x86_64-w64-mingw32, runner: windows-2025 }
          - { triple: aarch64-w64-mingw32, runner: windows-11-arm }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: xclang
        run: echo "X=$(sdk/get-xclang.sh "$XCLANG" ${{ matrix.host.triple }} "$RUNNER_TEMP")" >> "$GITHUB_ENV"
      - name: Fetch the CRT and the Windows SDK from Microsoft
        run: |
          start=$SECONDS
          python sdk/vendor-sdk.py windows fetch --accept-license --cache "$RUNNER_TEMP/cache" --out "$RUNNER_TEMP/winsysroot" 2>&1 | tee fetch.txt
          took=$((SECONDS - start))
          du -sh "$RUNNER_TEMP/winsysroot" | tee -a fetch.txt
          ls "$RUNNER_TEMP/winsysroot/VC/Tools/MSVC" "$RUNNER_TEMP/winsysroot/Windows Kits/10/Include"
          { echo "### ${{ matrix.host.triple }}: fetch + unpack ${took} s"; grep -E 'packages|files|file system|winsysroot' fetch.txt | sed 's/^/    /'; } >> "$GITHUB_STEP_SUMMARY"
          W=$RUNNER_TEMP/winsysroot
          case "$(uname -s)" in MINGW*) W=$(cygpath -m "$W") ;; esac
          echo "W=$W" >> "$GITHUB_ENV"
      - name: Build
        run: sdk/build-msvc.sh "$X" "$W" out
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: msvc-${{ matrix.host.triple }}
          path: out

  msvc-kotatsu:
    name: kotatsu for ${{ matrix.arch }}-pc-windows-msvc, from ${{ matrix.host.triple }}
    runs-on: ${{ matrix.host.runner }}
    strategy:
      fail-fast: false
      matrix:
        host:
          - { triple: x86_64-unknown-linux-gnu, runner: ubuntu-24.04 }
          - { triple: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }
          - { triple: aarch64-apple-darwin, runner: macos-15 }
          - { triple: x86_64-apple-darwin, runner: macos-15-intel }
          - { triple: x86_64-w64-mingw32, runner: windows-2025 }
          - { triple: aarch64-w64-mingw32, runner: windows-11-arm }
        arch: [x86_64, aarch64]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install cmake ninja
      - name: xclang, the CRT and the Windows SDK, kotatsu
        run: |
          echo "X=$(sdk/get-xclang.sh "$XCLANG" ${{ matrix.host.triple }} "$RUNNER_TEMP")" >> "$GITHUB_ENV"
          python sdk/vendor-sdk.py windows fetch --accept-license --arch ${{ matrix.arch }} --cache "$RUNNER_TEMP/cache" --out "$RUNNER_TEMP/winsysroot"
          W=$RUNNER_TEMP/winsysroot K=$RUNNER_TEMP/kotatsu S=$PWD
          case "$(uname -s)" in MINGW*) W=$(cygpath -m "$W") K=$(cygpath -m "$K") S=$(cygpath -m "$S") ;; esac
          echo "W=$W" >> "$GITHUB_ENV"; echo "K=$K" >> "$GITHUB_ENV"; echo "S=$S" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none https://github.com/clice-io/kotatsu "$K"
          git -C "$K" checkout -q "$KOTATSU"
      - name: Build
        run: |
          # NOMINMAX: kotatsu's tests include <winsock2.h> without it, which its
          # CI does not see, as kota_http (KOTA_BUILD_ALL_TESTS) defines it.
          CXXFLAGS=-DNOMINMAX cmake -S "$K" -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$S/sdk/msvc.cmake" -DXCLANG_ROOT="$X" \
            -DWINSYSROOT="$W" -DWINDOWS_ARCH=${{ matrix.arch }} -DKOTA_ENABLE_TEST=ON
          cmake --build build --target unit_tests system_tests
          mkdir -p out/${{ matrix.arch }}
          cp build/unit_tests.exe build/system_tests.exe out/${{ matrix.arch }}/
      - uses: actions/upload-artifact@v7
        with:
          name: msvc-kotatsu-${{ matrix.host.triple }}-${{ matrix.arch }}
          path: out

  msvc-run:
    name: run on ${{ matrix.runner }}
    needs: [msvc, msvc-kotatsu]
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2025, arch: x86_64 }
          - { runner: windows-11-arm, arch: aarch64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: msvc-*
          path: art
      - name: kotatsu's sources, for its tests
        run: |
          git clone -q --filter=blob:none https://github.com/clice-io/kotatsu "$RUNNER_TEMP/kotatsu"
          git -C "$RUNNER_TEMP/kotatsu" checkout -q "$KOTATSU"
          echo "KOTATSU_SRC=$RUNNER_TEMP/kotatsu" >> "$GITHUB_ENV"
      - name: Run
        run: |
          fail=0
          for a in art/*; do
            echo "### $a"; cat "$a/build.txt" 2>/dev/null || true
            sdk/run.sh "$a/${{ matrix.arch }}" || fail=1
          done
          exit $fail

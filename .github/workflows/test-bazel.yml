name: test-bazel

# The Bazel module (packages/bazel) on a machine of every host:
# tests/bazel's tests, for the host and the musl targets, then
# tests/bazel/bazel.ts's checks of the actions' keys and of the module as
# the registry and git_override have it; and every host's toolchain for
# every other host's target it builds for, tests/bazel's tests (and, from
# Linux x64 to Windows x64, kotatsu's) cross-compiled there and run on a
# machine of the target (tests/bazel/cross.ts, on-target.yml).
#
#   release.yml     with a run's archives (dist-run), unpacked and named by
#                   XCLANG_ROOT and the like, before they are released: the
#                   module's tests only
#   checks.yml,     with a published release's archives (the latest by
#   weekly.yml,     default), versions.bzl made from its SHA256SUMS
#   published.yml,
#   by hand
#
# Publishing the module to bazel.clice.io is published.yml's.

on:
  workflow_call:
    inputs:
      dist-run:
        description: Run whose dist-<host> archives the module is tested with; none for a published release's
        type: string
        default: ""
      release:
        description: Published release whose archives, without dist-run
        type: string
        default: latest
  workflow_dispatch:
    inputs:
      release:
        description: Published release whose archives the module is tested with
        type: string
        default: latest

permissions:
  contents: read
  actions: read

env:
  # gh release download's release: none for the latest.
  RELEASE: ${{ inputs.release != 'latest' && inputs.release || '' }}

jobs:
  module:
    name: module (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        host:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-w64-mingw32
          - aarch64-w64-mingw32
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    runs-on: ${{ fromJSON('{"x86_64-unknown-linux-gnu":"ubuntu-24.04","aarch64-unknown-linux-gnu":"ubuntu-24.04-arm","x86_64-w64-mingw32":"windows-2025","aarch64-w64-mingw32":"windows-11-arm","aarch64-apple-darwin":"macos-15","x86_64-apple-darwin":"macos-15-intel"}')[matrix.host] }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install -g @bazel/bazelisk
      # A tag's tree names the release before it: the digests are known only
      # once its archives are.
      - name: Release digests
        if: ${{ !inputs.dist-run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $RELEASE -R "$GITHUB_REPOSITORY" -p SHA256SUMS -D "$RUNNER_TEMP"
          node packages/bazel/bazel.ts versions "$RUNNER_TEMP/SHA256SUMS"
      - uses: ./.github/actions/archives
        if: inputs.dist-run
        with:
          host: ${{ matrix.host }}
          dist-run: ${{ inputs.dist-run }}
      - name: The archives
        if: inputs.dist-run
        run: |
          env="--repo_env=XCLANG_ROOT=$XCLANG_TREE --repo_env=XCLANG_LIBCLANG_ROOT=$XCLANG_LIBCLANG"
          [[ -n "$XCLANG_LIBCLANG_ASAN" ]] && env="$env --repo_env=XCLANG_LIBCLANG_ASAN_ROOT=$XCLANG_LIBCLANG_ASAN"
          echo "REPO_ENV=$env" >> "$GITHUB_ENV"
      - name: Test
        working-directory: tests/bazel
        run: |
          # Windows: a short output root, and runfiles as symlinks.
          startup=(); [[ "$RUNNER_OS" == Windows ]] && startup=(--output_user_root=C:/b --windows_enable_symlinks)
          bazel "${startup[@]}" test //... $REPO_ENV --disk_cache="$RUNNER_TEMP/disk"
          bazel "${startup[@]}" test -c opt //... $REPO_ENV --disk_cache="$RUNNER_TEMP/disk"
          # A GSYM, read by the toolchain's llvm-gsymutil through bazel run.
          # (Git Bash would make //symbols a Windows path.)
          gsym="$PWD/bazel-bin/symbols/hello.gsym"; [[ "$RUNNER_OS" == Windows ]] && gsym="$(cygpath -m "$gsym")"
          MSYS_NO_PATHCONV=1 bazel "${startup[@]}" build --strip=never //symbols:hello_symbols $REPO_ENV --disk_cache="$RUNNER_TEMP/disk"
          MSYS_NO_PATHCONV=1 bazel "${startup[@]}" run $REPO_ENV --disk_cache="$RUNNER_TEMP/disk" @xclang//bazel:llvm-gsymutil -- "$gsym" | grep '"main"'
      # The musl targets from every host: tests/bazel's tests built, and on
      # Linux of their architecture run, as static programs. Not the
      # packages of shared libraries, debuggers and libclang (no musl build),
      # and only with archives that carry them (23.1.2.10 and later).
      - name: musl
        working-directory: tests/bazel
        run: |
          startup=(); [[ "$RUNNER_OS" == Windows ]] && startup=(--output_user_root=C:/b --windows_enable_symlinks)
          external="$(bazel "${startup[@]}" info output_base $REPO_ENV)/external"
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            if ! ls -d "$external"/*+xclang_${{ matrix.host }}/$target > /dev/null 2>&1; then
              echo "::notice::the archives of ${{ matrix.host }} have no $target"
              continue
            fi
            command=build; [[ "$RUNNER_OS" == Linux && "$target" == "$(uname -m)-unknown-linux-musl" ]] && command=test
            bazel "${startup[@]}" $command --platforms=@xclang//platforms:$target //c/... //cpp/... //modules/... //options/... \
              $REPO_ENV --disk_cache="$RUNNER_TEMP/disk"
          done
      # gdb, for tests/bazel/bazel.ts's debugger checks.
      - name: gdb
        if: ${{ runner.os == 'Linux' && !inputs.dist-run }}
        run: command -v gdb || { sudo apt-get update -q && sudo apt-get install -y -q gdb; }
      # Keys of the downloaded archives: a run's unpacked ones are not
      # named by packages/bazel/bazel/versions.bzl.
      - name: Cache keys and inputs
        if: ${{ !inputs.dist-run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tests/bazel/bazel.ts --disk-cache "$RUNNER_TEMP/disk"

  # Built here, run on a machine of the target by on-target.yml: macOS
  # targets build on macOS hosts only. Not for a run's archives, whose
  # libclang is the host's only.
  cross:
    if: ${{ !inputs.dist-run }}
    name: cross (${{ matrix.host }} to ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        host: &hosts
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-w64-mingw32
          - aarch64-w64-mingw32
          - aarch64-apple-darwin
          - x86_64-apple-darwin
        target: *hosts
        exclude:
          - { host: x86_64-unknown-linux-gnu, target: x86_64-unknown-linux-gnu }
          - { host: aarch64-unknown-linux-gnu, target: aarch64-unknown-linux-gnu }
          - { host: x86_64-w64-mingw32, target: x86_64-w64-mingw32 }
          - { host: aarch64-w64-mingw32, target: aarch64-w64-mingw32 }
          - { host: aarch64-apple-darwin, target: aarch64-apple-darwin }
          - { host: x86_64-apple-darwin, target: x86_64-apple-darwin }
          - { host: x86_64-unknown-linux-gnu, target: aarch64-apple-darwin }
          - { host: x86_64-unknown-linux-gnu, target: x86_64-apple-darwin }
          - { host: aarch64-unknown-linux-gnu, target: aarch64-apple-darwin }
          - { host: aarch64-unknown-linux-gnu, target: x86_64-apple-darwin }
          - { host: x86_64-w64-mingw32, target: aarch64-apple-darwin }
          - { host: x86_64-w64-mingw32, target: x86_64-apple-darwin }
          - { host: aarch64-w64-mingw32, target: aarch64-apple-darwin }
          - { host: aarch64-w64-mingw32, target: x86_64-apple-darwin }
    runs-on: ${{ fromJSON('{"x86_64-unknown-linux-gnu":"ubuntu-24.04","aarch64-unknown-linux-gnu":"ubuntu-24.04-arm","x86_64-w64-mingw32":"windows-2025","aarch64-w64-mingw32":"windows-11-arm","aarch64-apple-darwin":"macos-15","x86_64-apple-darwin":"macos-15-intel"}')[matrix.host] }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install -g @bazel/bazelisk
      - name: Release digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $RELEASE -R "$GITHUB_REPOSITORY" -p SHA256SUMS -D "$RUNNER_TEMP"
          node packages/bazel/bazel.ts versions "$RUNNER_TEMP/SHA256SUMS"
      - name: Build
        run: node tests/bazel/cross.ts build "${{ matrix.target }}" "$RUNNER_TEMP/out/${{ matrix.host }}/tests"
      # The latest kotatsu of the clice registry, its tests among the rest of
      # it (other test rules than cc_test build for another target only on
      # any execution platform: Bazel's legacy test toolchain).
      - name: kotatsu
        if: matrix.host == 'x86_64-unknown-linux-gnu' && matrix.target == 'x86_64-w64-mingw32'
        run: |
          node tests/bazel/cross.ts registry kotatsu "$RUNNER_TEMP/kotatsu"
          node tests/bazel/cross.ts build "${{ matrix.target }}" "$RUNNER_TEMP/out/${{ matrix.host }}/kotatsu" \
            --workspace "$RUNNER_TEMP/kotatsu" -- --@bazel_tools//tools/test:incompatible_use_default_test_toolchain=false
      - uses: actions/upload-artifact@v7
        with:
          name: programs-bazel-${{ matrix.host }}-to-${{ matrix.target }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 7

  # What every other host built for this target, run there: <host>/tests,
  # <host>/kotatsu, short paths for Windows.
  run:
    needs: cross
    if: ${{ !cancelled() && !inputs.dist-run }}
    uses: ./.github/workflows/on-target.yml
    with:
      targets: '["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-w64-mingw32", "aarch64-w64-mingw32", "aarch64-apple-darwin", "x86_64-apple-darwin"]'
      pattern: programs-bazel-*-to-{0}
      dir: .

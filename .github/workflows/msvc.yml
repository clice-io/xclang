name: msvc

# The MSVC targets, x86_64- and aarch64-pc-windows-msvc, of a run's
# archives (tests/msvc.ts): on a machine of three hosts, the Windows SDK
# fetched by the toolchain's own command (the archives carry it with
# main.yml's cli), programs built with clang, clang++, clang-cl and CMake
# for both targets, and from Linux kotatsu and its tests; then every
# host's programs run on windows-2025 and windows-11-arm. Only programs
# leave a job, never anything of the SDK.

on:
  workflow_dispatch:
    inputs:
      dist-run:
        description: Run whose dist-<host> archives to test
        type: string
        required: true
  workflow_call:
    inputs:
      dist-run:
        type: string
        required: true

permissions:
  contents: read
  actions: read

env:
  # kotatsu, as the SDK probe built it for MSVC.
  KOTATSU: d3b82f79499bd8e2e5e557f7bf7eca7a27b928b7

jobs:
  build:
    name: build on ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        host: [x86_64-unknown-linux-gnu, aarch64-apple-darwin, x86_64-w64-mingw32]
    runs-on: ${{ fromJSON('{"x86_64-unknown-linux-gnu":"ubuntu-24.04","aarch64-apple-darwin":"macos-15","x86_64-w64-mingw32":"windows-2025"}')[matrix.host] }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install cmake ninja
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ matrix.host }}
          path: ${{ runner.temp }}/dist
          run-id: ${{ inputs.dist-run }}
          github-token: ${{ github.token }}
      # Windows' own tar (bsdtar), as a user unpacks it.
      - name: Unpack
        run: |
          tar=tar; [[ "$RUNNER_OS" == Windows ]] && tar=/c/Windows/System32/tar.exe
          mkdir -p "$RUNNER_TEMP/unpacked"
          "$tar" -xf "$RUNNER_TEMP"/dist/xclang-*.tar.xz -C "$RUNNER_TEMP/unpacked"
      - name: kotatsu
        if: matrix.host == 'x86_64-unknown-linux-gnu'
        run: |
          git clone -q --filter=blob:none https://github.com/clice-io/kotatsu "$RUNNER_TEMP/kotatsu"
          git -C "$RUNNER_TEMP/kotatsu" checkout -q "$KOTATSU"
          echo "KOTATSU_ARGS=--kotatsu $RUNNER_TEMP/kotatsu" >> "$GITHUB_ENV"
      - name: Build
        run: node tests/msvc.ts --tree "$RUNNER_TEMP/unpacked/xclang" --out programs $KOTATSU_ARGS
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: msvc-programs-${{ matrix.host }}
          path: programs
          if-no-files-found: error

  run:
    name: run on ${{ matrix.runner }}
    needs: build
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2025, arch: x86_64 }
          - { runner: windows-11-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: msvc-programs-*
          path: programs
      # kotatsu's tests read its snapshots, in its source tree.
      - name: kotatsu
        if: matrix.arch == 'x86_64'
        run: |
          git clone -q --filter=blob:none https://github.com/clice-io/kotatsu "$RUNNER_TEMP/kotatsu"
          git -C "$RUNNER_TEMP/kotatsu" checkout -q "$KOTATSU"
          echo "KOTATSU_SRC=$RUNNER_TEMP/kotatsu" >> "$GITHUB_ENV"
      - name: Run
        run: node tests/msvc.ts --run programs/*/${{ matrix.arch }}

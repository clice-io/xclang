name: runtimes

# The runtimes of every target, built once with the bootstrap compiler:
# one artifact runtimes-<triple> per Linux and Windows target, one
# runtimes-darwin for both macOS targets.

on:
  workflow_call:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - name: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
          - name: x86_64-w64-mingw32
            os: ubuntu-24.04
          - name: aarch64-w64-mingw32
            os: ubuntu-24.04
          - name: darwin
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Runtimes
        run: pixi run runtimes --target ${{ matrix.name }}
      - name: Pack
        run: tar -C work/out -cf - runtimes-${{ matrix.name }} | zstd -T0 -3 -o runtimes-${{ matrix.name }}.tar.zst
      - uses: actions/upload-artifact@v7
        with:
          name: runtimes-${{ matrix.name }}
          path: runtimes-${{ matrix.name }}.tar.zst
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

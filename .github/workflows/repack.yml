name: repack

# One host's archives of a repack, a run whose compiler and runtimes are
# those of an earlier release's run (main.yml with reuse-run and no
# toolchain stage), against that release's archives: tests/repack.ts
# checks that only what the packaging writes differs (config files, the
# CMake package, the xclang command, the license notices), and every
# program, library and header is the release's, byte for byte.

on:
  workflow_call:
    inputs:
      host:
        type: string
        required: true
      previous:
        description: The release repacked
        type: string
        required: true
      dist-run:
        type: string
        required: true

jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ inputs.host }}
          path: dist
          run-id: ${{ inputs.dist-run }}
          github-token: ${{ github.token }}
      - name: The release's archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir previous
          for file in dist/*.tar.xz; do
            name=$(basename "$file" | sed -E "s/-[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+([-.])/-${{ inputs.previous }}\1/")
            gh release download "${{ inputs.previous }}" -R "$GITHUB_REPOSITORY" -p "$name" -D previous
          done
          ls -la dist previous
      - name: Compare
        run: node tests/repack.ts --previous previous --dist dist

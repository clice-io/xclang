name: macos

# The macOS targets, aarch64- and x86_64-apple-darwin, from Linux and
# Windows hosts, of a run's archives (tests/macos.ts): on a machine of each
# such host, Apple's SDK fetched by the toolchain's own command (the
# archives carry it with main.yml's cli), programs built with clang,
# clang++ and CMake for both targets; then every host's programs run on
# macos-15 (arm64) and macos-15-intel. Only programs leave a job, with
# their dSYMs and xclang's sanitizer runtimes, never anything of the SDK.

on:
  workflow_dispatch:
    inputs:
      dist-run:
        description: Run whose dist-<host> archives to test
        type: string
        required: true
  workflow_call:
    inputs:
      dist-run:
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: build on ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        host: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, x86_64-w64-mingw32, aarch64-w64-mingw32]
    runs-on: ${{ fromJSON('{"x86_64-unknown-linux-gnu":"ubuntu-24.04","aarch64-unknown-linux-gnu":"ubuntu-24.04-arm","x86_64-w64-mingw32":"windows-2025","aarch64-w64-mingw32":"windows-11-arm"}')[matrix.host] }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install cmake ninja
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ matrix.host }}
          path: ${{ runner.temp }}/dist
          run-id: ${{ inputs.dist-run }}
          github-token: ${{ github.token }}
      # Windows' own tar (bsdtar), as a user unpacks it.
      - name: Unpack
        run: |
          tar=tar; [[ "$RUNNER_OS" == Windows ]] && tar=/c/Windows/System32/tar.exe
          mkdir -p "$RUNNER_TEMP/unpacked"
          "$tar" -xf "$RUNNER_TEMP"/dist/xclang-*.tar.xz -C "$RUNNER_TEMP/unpacked"
      - name: Build
        run: node tests/macos.ts --tree "$RUNNER_TEMP/unpacked/xclang" --out programs
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: macos-programs-${{ matrix.host }}
          path: programs
          if-no-files-found: error

  run:
    name: run on ${{ matrix.runner }}
    needs: build
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: macos-programs-*
          path: programs
      - name: Run
        run: node tests/macos.ts --run programs/*/${{ matrix.arch }} programs/*/universal

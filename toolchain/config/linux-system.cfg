# Linux target, the system's libraries (-stdlib=platform, -stdlib=libstdc++;
# patches/0018): glibc and GCC's libstdc++ as clang finds them, the host's
# own, a distribution's cross packages for another architecture, or the
# sysroot that --sysroot names. lld links, which reads xclang's LTO objects.
-fuse-ld=lld

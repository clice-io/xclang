# libc++, xclang's, as on every other target: its headers, those all
# targets share after the target's own __config_site, which names the
# library, lib/clang/<ver>/lib/windows/libc++-@ARCH@.lib, in every object
# that includes it. /clang:-stdlib=platform selects Microsoft's STL
# instead, which clang-cl finds next to the CRT's headers, and leaves these
# out (patches/0015). clang-cl has neither option of its own; patches/0011
# keeps them from being reported unused where nothing is C++.
/clang:-stdlib=libc++
/clang:-stdlib++-isystem<CFGDIR>/../libc++/include/@NORMALIZED@/c++/v1
/clang:-stdlib++-isystem<CFGDIR>/../libc++/include/c++/v1

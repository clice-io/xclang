# macOS target, with either C++ library: the deployment target, and the
# linker, ld64.lld, on macOS too (patches/0007). -fuse-ld=ld selects
# Apple's, for objects without LTO: it reads bitcode with Xcode's libLTO,
# which does not read this LLVM's, and xclang carries none, as it carries
# no LTO plugin for other system linkers.
-mmacos-version-min=@MACOS_MIN@
-fuse-ld=lld

# libc++, xclang's, as on every other target: its headers, those all
# targets share after the target's own __config_site, which names the
# library, lib/clang/<ver>/lib/windows/libc++-@ARCH@.lib, in every object
# that includes it. -stdlib=platform selects Microsoft's STL instead, which
# clang finds next to the CRT's headers, and leaves these out
# (patches/0015).
-stdlib=libc++
-stdlib++-isystem <CFGDIR>/../libc++/include/@NORMALIZED@/c++/v1
-stdlib++-isystem <CFGDIR>/../libc++/include/c++/v1

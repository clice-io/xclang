# Linux target, musl, the system's libraries (-stdlib=platform,
# -stdlib=libstdc++; patches/0018): those of the sysroot that --sysroot
# names, an Alpine root say, with GCC's libstdc++. xclang's compiler needs
# glibc, so it never runs on such a system itself. lld links, which reads
# xclang's LTO objects.
-fuse-ld=lld

# Linux target, musl, the system's libraries (-stdlib=platform,
# -stdlib=libstdc++; patches/0018): those of a musl host (Alpine), or of
# the sysroot that --sysroot names, with GCC's libstdc++. lld links, which
# reads xclang's LTO objects, with the 8 MiB thread stacks of musl.cfg.
-fuse-ld=lld
-Wl,-z,stack-size=8388608

# Linux target, musl: musl from the sysroot next to this file and xclang's
# own runtimes, all linked statically into a program that takes nothing
# from the system it runs on. libc++'s headers are those all targets share,
# after the target's own __config_site. Its threads have 8 MiB of stack, as
# glibc's have, where musl's are 128 KiB unless the program asks for more
# (PT_GNU_STACK, up to 8 MiB): clang, run on a thread of a program, needs
# it; a -Wl,-z,stack-size= of the command line takes its place.
--sysroot=<CFGDIR>/../@TRIPLE@
-stdlib++-isystem <CFGDIR>/../libc++/include/@NORMALIZED@/c++/v1
-stdlib++-isystem <CFGDIR>/../libc++/include/c++/v1
-rtlib=compiler-rt
-unwindlib=libunwind
-stdlib=libc++
-static
-fuse-ld=lld
-Wl,-z,stack-size=8388608

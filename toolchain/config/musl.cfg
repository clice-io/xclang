# Linux target, musl: musl from the sysroot next to this file and xclang's
# own runtimes, all linked statically into a program that takes nothing
# from the system it runs on. libc++'s headers are those all targets share,
# after the target's own __config_site.
--sysroot=<CFGDIR>/../@TRIPLE@
-stdlib++-isystem <CFGDIR>/../libc++/include/@NORMALIZED@/c++/v1
-stdlib++-isystem <CFGDIR>/../libc++/include/c++/v1
-rtlib=compiler-rt
-unwindlib=libunwind
-stdlib=libc++
-static
-fuse-ld=lld

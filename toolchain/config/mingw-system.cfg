# Windows target, the system's libraries (-stdlib=platform,
# -stdlib=libstdc++; patches/0018): mingw-w64 and its C++ library from the
# sysroot that --sysroot names (MSYS2's ucrt64, a distribution's
# mingw-w64). Without one, clang finds the tree's own mingw-w64, which has
# no libstdc++. lld links, which reads xclang's LTO objects.
-fuse-ld=lld

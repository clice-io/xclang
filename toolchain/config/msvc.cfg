# Windows target, MSVC ABI: Microsoft's CRT and STL and the Windows SDK,
# those of the SDK in use, which `xclang sdk fetch windows --accept-license`
# fetches into ../sdk; @TRIPLE@-sdk.cfg names it, a file xclang sdk writes
# (fetch, use, remove). With none in use, clang finds Visual Studio on a
# Windows host as it does by itself; on another host it finds nothing of
# Microsoft's, and a compile that includes a header of the CRT stops there.
@@TRIPLE@-sdk.cfg
-fuse-ld=lld
# compiler-rt's builtins (__udivti3, ...), which neither clang driver links
# for MSVC targets by itself: named in every object, as the CRT is, so
# lld-link finds them in lib/clang/<ver>/lib/windows also when it links
# on its own.
-Xclang --dependent-lib=clang_rt.builtins-@ARCH@.lib
# The hybrid CRT: the VC runtime and the STL linked statically (/MT, the
# default), UCRT from Windows (ucrtbase.dll, part of Windows 10 and later)
# instead of the static libucrt.lib. /MD (-fms-runtime-lib=dll) takes
# ucrt.lib anyway; the debug CRTs need /nodefaultlib:ucrt.lib on the link.
-Xclang --linker-option=/nodefaultlib:libucrt.lib
-Xclang --dependent-lib=ucrt.lib
# UCRT's inline functions (ctime, ...) with external linkage, not static:
# what MSVC 19.50 and later make the default, and what a module needs to
# export them (import std).
-D_STATIC_INLINE_UCRT_FUNCTIONS=0
